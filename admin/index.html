.g-hero .pal{display:inline-block;animation:palabra .8s var(--ease-out) backwards;animation-delay:calc(var(--w,0)*90ms + 120ms)}
.calm .g-hero .pal{animation:none}
.g-lede{margin:0 0 30px;font-size:clamp(1.05rem,1.45vw,1.3rem);line-height:1.5;color:var(--ink-2);max-width:46ch}
.g-cta{display:flex;align-items:center;flex-wrap:wrap;gap:14px 26px}
.g-link{font:600 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:3px;transition:color .2s,border-color .2s}
.g-link:hover{color:var(--cherry);border-color:var(--cherry)}
.g-hechos{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:44px 0 0;padding:18px 0 0;border-top:1px solid var(--ink)}
.g-hechos b{display:block;font:800 clamp(1.1rem,1.7vw,1.45rem)/1.05 var(--display);letter-spacing:-.02em}
.g-hechos small{display:block;margin-top:6px;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.g-hero-art{position:relative;min-height:420px;display:grid;place-items:end center;overflow:hidden;background:var(--cherry);border:1px solid var(--ink)}
.g-hero-art::before{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(180deg,transparent,rgba(20,18,16,.22))}
.g-hero-foto{position:relative;z-index:1;display:block;height:78%;width:auto;max-width:86%;object-fit:contain;margin-bottom:0;
  animation:g-sube 1.4s var(--ease-out) both;animation-delay:.25s;transition:transform .6s var(--ease-out)}
@keyframes g-sube{from{opacity:0;transform:translateY(40px)}}
@media (hover:hover) and (pointer:fine){.g-hero-art:hover .g-hero-foto{transform:translateY(-10px) rotate(-1.5deg)}}
.g-hero-tag{position:absolute;z-index:2;left:18px;top:16px;margin:0;color:var(--paper);font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.g-hero-tag b{display:block;font:800 clamp(2.2rem,4vw,3.6rem)/.9 var(--display);letter-spacing:-.04em;text-transform:uppercase;margin-top:6px}
.g-sello{position:absolute;z-index:2;right:14px;bottom:14px;width:clamp(110px,15vw,160px);height:auto;color:var(--paper);
  animation:g-gira 24s linear infinite;font:700 13px var(--mono);letter-spacing:.22em;text-transform:uppercase;fill:currentColor}
.g-sello circle{fill:none;stroke:currentColor;stroke-width:1}
@keyframes g-gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.g-sello,.g-hero-foto{animation:none}}

/* la cinta: el precio del día y lo que prometemos, en una sola línea que corre */
.g-ticker{position:relative;width:100vw;margin-left:calc(50% - 50vw);background:var(--ink);color:var(--paper);overflow:hidden;
  padding:11px 0;font:500 11.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid var(--ink)}
.g-ticker-track{display:flex;width:max-content;animation:g-marquee 46s linear infinite}
.g-ticker:hover .g-ticker-track{animation-play-state:paused}
.g-ticker span{display:inline-flex;align-items:center;gap:14px;padding:0 30px;white-space:nowrap}
.g-ticker span::after{content:"";width:6px;height:6px;background:var(--cherry);margin-left:16px}
.g-ticker em{font-style:normal;color:var(--cherry)}
@keyframes g-marquee{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.g-ticker-track{animation:none;flex-wrap:wrap;width:auto}.g-ticker span{padding:4px 16px}}

/* cada sección: número, título y una línea */
.g-sec{padding-top:clamp(60px,9vw,120px)}
.g-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 34px;align-items:end;padding-bottom:20px;margin-bottom:0;border-bottom:1px solid var(--ink)}
.g-head .g-num{padding-bottom:10px}
.g-head h2{font-size:clamp(2.3rem,5.6vw,5rem);text-transform:uppercase;letter-spacing:-.04em;max-width:16ch}
.g-head h2 em{text-transform:none;font-size:.92em}
.g-head p{grid-column:2;margin:14px 0 0;max-width:56ch;color:var(--ink-2);font-size:1.05rem}
.g-head .g-link{grid-column:2;justify-self:start;margin-top:14px}

/* los tres cafés: una rejilla de tres, cada bolsa sobre su propia tinta */
.g-prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--ink);border-top:0}
.g-prod{--pc:#2F5A3C;display:grid;grid-template-rows:auto 1fr;border-right:1px solid var(--ink);background:var(--paper);min-width:0}
.g-prod:last-child{border-right:0}
.g-prod-art{position:relative;aspect-ratio:1/1.02;background:var(--pc);display:grid;place-items:end center;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--ink)}
.g-prod-art::before{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(180deg,transparent,rgba(20,18,16,.22))}
.g-prod-foto{position:relative;z-index:1;display:block;height:80%;width:auto;max-width:84%;object-fit:contain;transition:transform .55s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.g-prod:hover .g-prod-foto{transform:translateY(-10px) rotate(-2deg)}}
.g-prod-art svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.g-prod-art .alt-label{display:none}
.g-prod-n{position:absolute;z-index:2;right:16px;top:14px;font:600 11px var(--mono);letter-spacing:.2em;color:var(--paper)}
.g-prod-sca{position:absolute;z-index:2;left:18px;top:16px;margin:0;color:var(--paper)}
.g-prod-sca b{display:block;font:800 clamp(2.4rem,3.6vw,3.2rem)/.9 var(--display);letter-spacing:-.04em}
.g-prod-sca small{display:block;margin-top:6px;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.g-pronto{position:relative;z-index:1;align-self:center;justify-self:center;width:100%;font:800 clamp(1.5rem,2.9vw,2.6rem)/.92 var(--display);letter-spacing:-.03em;text-transform:uppercase;color:var(--paper);text-align:center;padding:0 16px}
.g-pronto i{display:block;font:italic 400 .42em/1.2 var(--serif);text-transform:none;letter-spacing:0;margin-top:14px;opacity:.9}
.g-prod.pronto .g-prod-art{background:var(--pc)}
.g-prod-body{padding:22px 22px 24px;display:grid;gap:8px;align-content:start}
.g-prod-body h3{font-size:clamp(1.7rem,2.7vw,2.5rem);text-transform:uppercase;line-height:.92;margin-top:2px}
.g-notas{margin:0;font:italic 1.2rem/1.3 var(--serif);color:var(--ink-2)}
.g-prod-foot{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;border-top:1px solid var(--ink);padding-top:16px;margin-top:12px}
.g-prod-foot b{font:700 1.2rem var(--mono);letter-spacing:-.01em}
.g-prod-foot small{font-size:12px;color:var(--ink-3)}
.g-prod-foot .btn{margin-left:auto}
.g-prod.pronto .g-prod-foot b{font:800 1rem var(--display);text-transform:uppercase;letter-spacing:.02em}
.g-subasta{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;border:1px solid var(--ink);border-top:0;padding:18px 22px;background:var(--ink);color:var(--paper)}
.g-subasta p{margin:0;font-size:1.02rem}
.g-subasta p b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin-right:10px}
.g-subasta .live-dot{margin-right:8px}
.g-subasta .btn{border-color:var(--paper);color:var(--paper)}
.g-subasta .btn:hover{background:var(--cherry);border-color:var(--cherry);color:#fff}

/* el manifiesto: una página negra, el titular grande y tres principios numerados */
.g-manifiesto{width:100vw;margin:clamp(60px,9vw,120px) 0 0 calc(50% - 50vw);background:var(--ink);color:var(--paper);padding:clamp(56px,8vw,112px) var(--borde)}
.g-manifiesto-in{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px clamp(32px,6vw,90px);align-items:start}
.g-manifiesto .g-kicker{color:var(--paper);grid-column:1/-1}
.g-manifiesto h2{font-size:clamp(2.3rem,5.4vw,4.8rem);text-transform:uppercase;letter-spacing:-.04em;line-height:.92;color:var(--paper)}
.g-manifiesto h2 em{text-transform:none;font-size:.92em}
.g-principios{list-style:none;margin:0;padding:0;counter-reset:gp;display:grid;border-top:1px solid rgba(245,240,230,.3)}
.g-principios li{counter-increment:gp;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;padding:20px 0 22px;border-bottom:1px solid rgba(245,240,230,.3)}
.g-principios li::before{content:"0" counter(gp);font:600 11px var(--mono);letter-spacing:.2em;color:var(--cherry);padding-top:6px}
.g-principios b{font:800 clamp(1.15rem,1.8vw,1.5rem)/1.05 var(--display);letter-spacing:-.02em}
.g-principios span{grid-column:2;color:rgba(245,240,230,.75);font-size:15px;line-height:1.55;max-width:40ch}
.g-pago{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(245,240,230,.3);margin-top:8px}
.g-pago div{padding:24px 24px 24px 0}
.g-pago div + div{padding-left:24px;border-left:1px solid rgba(245,240,230,.3)}
.g-pago small{display:block;font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(245,240,230,.7);margin-bottom:12px}
.g-pago b{display:block;font:800 clamp(2rem,4.2vw,3.6rem)/.95 var(--display);letter-spacing:-.04em}
.g-pago .mas b{color:var(--cherry)}
.g-pago i{display:block;margin-top:8px;font:italic 15px var(--serif);color:rgba(245,240,230,.75)}

/* la cereza: la sección ya existe; aquí solo toma la voz del resto */
.por-dentro{padding-top:clamp(60px,9vw,120px)}
.por-dentro .section-head{margin-bottom:22px}
.cereza-capas li{border-top-color:var(--line)}
.cereza-btn{border-bottom-color:var(--ink)}
.cereza-halo{opacity:.7}

/* la suscripción en el inicio: un bloque naranja con los tres planes en fila */
.g-sub{margin-top:clamp(60px,9vw,120px);background:var(--cherry);color:#fff;border:1px solid var(--ink);padding:clamp(28px,4.5vw,56px);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px clamp(28px,5vw,72px);align-items:start}
.g-sub .g-kicker{color:#fff}
.g-sub .g-num{color:#fff}
.g-sub h2{font-size:clamp(2.2rem,5vw,4.4rem);text-transform:uppercase;letter-spacing:-.04em;color:#fff;margin:12px 0 18px}
.g-sub h2 em{color:var(--paper);text-transform:none;font-size:.92em}
.g-sub p{margin:0 0 26px;max-width:46ch;font-size:1.05rem;color:rgba(255,255,255,.9)}
.g-sub .btn.claro{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.g-sub .btn.claro:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.g-planes{list-style:none;margin:0;padding:0;border-top:1px solid rgba(255,255,255,.55)}
.g-planes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.55)}
.g-planes b{font:800 clamp(1.3rem,2.2vw,1.9rem)/1 var(--display);text-transform:uppercase;letter-spacing:-.02em}
.g-planes span{grid-column:1;font-size:14px;color:rgba(255,255,255,.85)}
.g-planes strong{grid-column:2;grid-row:1/3;font:700 1.1rem var(--mono);white-space:nowrap}
.g-planes strong small{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-left:4px;opacity:.85}
.g-planes li.hot{position:relative}
.g-planes li.hot b::after{content:"★";font-size:.6em;vertical-align:super;margin-left:6px}

/* el diario en el inicio: tres columnas, como un sumario */
.g-diario{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--ink);border-top:0}
.g-diario article{display:grid;align-content:start;gap:12px;padding:24px 22px 26px;border-right:1px solid var(--ink);background:var(--paper);transition:background .25s var(--ease-out)}
.g-diario article:last-child{border-right:0}
@media (hover:hover) and (pointer:fine){.g-diario article:hover{background:var(--paper-2)}}
.g-diario .ent-meta{color:var(--ink-3)}
.g-diario h3{font-size:clamp(1.3rem,2vw,1.7rem);line-height:1;text-transform:uppercase}
.g-diario p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.55}
.g-diario .g-link{justify-self:start;margin-top:6px}

/* las fincas en el inicio: la misma rejilla del catálogo, pegada a su cabecera */
.g-sec .fincas{border-top:0;margin-top:0}
.faqs.g-sec{padding-top:clamp(60px,9vw,120px)}

/* ---- el celular: todo a una columna, las rejillas se vuelven listas ---- */
@media (max-width:1000px){
  .g-prods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-prod:nth-child(2n){border-right:0}
  .g-prod:nth-child(-n+2){border-bottom:1px solid var(--ink)}
  .g-prod:last-child:nth-child(odd){grid-column:1/-1}
  .g-prod:last-child:nth-child(odd) .g-prod-art{aspect-ratio:2/1}
  .g-manifiesto-in,.g-sub{grid-template-columns:1fr}
  .g-pago{grid-template-columns:1fr}
  .g-pago div + div{padding-left:0;border-left:0;border-top:1px solid rgba(245,240,230,.3)}
  .g-diario{grid-template-columns:1fr}
  .g-diario article{border-right:0;border-bottom:1px solid var(--ink)}
  .g-diario article:last-child{border-bottom:0}
}
@media (max-width:760px){
  .g-hero{grid-template-columns:1fr;min-height:0;gap:22px;padding-top:18px}
  .g-hero h1{font-size:clamp(3rem,15vw,4.6rem);max-width:none}
  .g-hero-art{min-height:0;aspect-ratio:4/5;order:2}
  .g-hechos{grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
  .g-head{grid-template-columns:1fr;gap:6px}
  .g-head p,.g-head .g-link{grid-column:1}
  .g-prods{grid-template-columns:1fr}
  .g-prod,.g-prod:nth-child(2n){border-right:0;border-bottom:1px solid var(--ink)}
  .g-prod:last-child{border-bottom:0}
  .g-prod:last-child:nth-child(odd) .g-prod-art,.g-prod-art{aspect-ratio:1}
  .g-manifiesto{padding-inline:16px}
  .g-sub{padding:26px 20px}
  .fincas{grid-template-columns:1fr}
  .finca,.finca.propia{border-right:0}
  .dos,.planes,.entradas{grid-template-columns:1fr}
  .card-cafe,.plan,.entrada{border-right:0}
}

/* ============================================================
   TIENDA, MÚSICA Y COMUNIDAD (octubre 2026)
   El menú queda en Inicio · Tienda · Suscripción. "Tienda" abre sus
   dos categorías; la subasta y el diario están apagados (CONFIG.ocultas).
   ============================================================ */
/* "Tienda" y su desplegable: aparece al pasar el cursor o al llegar con el teclado */
.tab-grupo{position:relative;display:flex}
.tab-sub{position:absolute;z-index:60;top:calc(100% + 10px);left:50%;min-width:250px;display:grid;padding:6px;
  background:var(--paper);border:1px solid var(--ink);opacity:0;visibility:hidden;transform:translate(-50%,6px);
  transition:opacity .2s var(--ease-out),transform .2s var(--ease-out),visibility 0s .2s}
.tab-sub::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.tab-grupo:hover .tab-sub,.tab-grupo:focus-within .tab-sub{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
.tab-sub a{padding:12px 14px;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-decoration:none;white-space:nowrap}
.tab-sub a:hover,.tab-sub a:focus-visible{background:var(--ink);color:var(--paper);outline:0}
@media (prefers-reduced-motion:reduce){.tab-sub{transition:none}}

/* la fila que une las tres páginas de la tienda */
.g-subnav{display:flex;flex-wrap:wrap;gap:0;margin:4px 0 26px;border:1px solid var(--ink);width:max-content;max-width:100%}
.g-subnav a{padding:10px 16px;font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-right:1px solid var(--ink)}
.g-subnav a:last-child{border-right:0}
.g-subnav a[aria-current=page]{background:var(--ink);color:var(--paper)}
@media (hover:hover) and (pointer:fine){.g-subnav a:not([aria-current=page]):hover{color:var(--cherry)}}

/* la tienda: dos puertas grandes */
.g-puertas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--ink)}
.g-puerta{--pc:var(--cherry);display:grid;grid-template-rows:auto 1fr;text-decoration:none;color:var(--ink);background:var(--paper);border-right:1px solid var(--ink)}
.g-puerta:last-child{border-right:0}
.g-puerta-art{position:relative;aspect-ratio:5/4;display:grid;place-items:end center;overflow:hidden;background:var(--pc);border-bottom:1px solid var(--ink)}
.g-puerta.oscura .g-puerta-art{background:var(--ink);place-items:center}
.g-puerta .g-prod-foto{height:84%}
.g-puerta-txt{display:grid;gap:8px;padding:24px 24px 28px}
.g-puerta-txt small{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.g-puerta-txt b{font:800 clamp(2rem,4vw,3.4rem)/.92 var(--display);letter-spacing:-.04em;text-transform:uppercase}
.g-puerta-txt i{font:italic 1.25rem/1.3 var(--serif);color:var(--ink-2)}
.g-puerta .g-prod-foto,.g-puerta-txt b{transition:transform .55s var(--ease-out),color .25s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.g-puerta:hover .g-prod-foto{transform:translateY(-10px) rotate(-2deg)}.g-puerta:hover .g-puerta-txt b{color:var(--cherry)}}

/* accesorios y merch: un bloque de color con el nombre, como una etiqueta */
.g-acc-grupo{margin-top:34px}
.g-acc-grupo .g-kicker{padding-bottom:12px;border-bottom:1px solid var(--ink)}
.g-accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));border-left:1px solid var(--ink)}
.g-acc{display:grid;grid-template-rows:auto 1fr;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--paper)}
.g-acc-art{position:relative;aspect-ratio:1;display:grid;align-content:end;padding:18px;background:var(--pc);color:var(--paper);cursor:pointer;overflow:hidden}
.g-acc-art b{font:800 clamp(1.5rem,2.4vw,2.1rem)/.92 var(--display);letter-spacing:-.03em;text-transform:uppercase;transition:transform .45s var(--ease-out)}
.g-acc-n{position:absolute;top:14px;right:16px;font:600 11px var(--mono);letter-spacing:.2em}
@media (hover:hover) and (pointer:fine){.g-acc:hover .g-acc-art b{transform:translateY(-6px)}}
.g-acc-body{display:grid;gap:10px;align-content:space-between;padding:18px 18px 20px}
.g-acc-body p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.g-acc .g-prod-foot{margin-top:0}
.g-acc .g-prod-foot b{font:800 .95rem var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--cherry)}

/* la música: el texto a la izquierda, el reproductor a la derecha, centrados entre sí.
   Antes la cabecera llevaba su propia rejilla dentro de esta y el texto quedaba en una columna angosta. */
.g-musica{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:32px clamp(32px,6vw,96px);align-items:center;
  border-top:1px solid var(--ink);margin-top:clamp(60px,9vw,120px);padding-top:clamp(40px,6vw,72px)}
.g-musica-txt{display:grid;gap:0;align-content:center;max-width:560px}
.g-musica-txt .g-kicker{margin-bottom:22px}
.g-musica-txt h2{font-size:clamp(2.4rem,5.2vw,4.8rem);text-transform:uppercase;letter-spacing:-.04em;line-height:.9}
.g-musica-txt h2 em{display:block;text-transform:none;font-size:.95em;margin-top:.04em}
.g-musica-txt > p:not(.g-kicker){margin:22px 0 0;max-width:42ch;font-size:clamp(1.02rem,1.3vw,1.15rem);line-height:1.55;color:var(--ink-2)}
.g-musica-cta{display:flex;align-items:center;flex-wrap:wrap;gap:14px 26px;margin-top:30px}
.g-musica-cta .g-link{margin-top:0}
.g-musica-player{position:relative;margin:0;border:1px solid var(--ink);background:#121212;line-height:0}
.g-musica-player::after{content:"";position:absolute;inset:auto -10px -10px auto;width:100%;height:100%;z-index:-1;background:var(--cherry);border:1px solid var(--ink)}
.g-musica-player figcaption{display:flex;align-items:center;gap:10px;padding:11px 14px;line-height:1.2;
  font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--paper);background:var(--ink);border-bottom:1px solid rgba(245,240,230,.15)}
.g-musica-player iframe{display:block;width:100%;height:352px;border:0;background:#121212}
.g-eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.g-eq i{display:block;width:3px;height:100%;background:var(--cherry);transform-origin:bottom;animation:g-eq 1.1s ease-in-out infinite alternate}
.g-eq i:nth-child(2){animation-delay:-.4s;animation-duration:.9s}
.g-eq i:nth-child(3){animation-delay:-.8s;animation-duration:1.3s}
@keyframes g-eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.g-eq i{animation:none;transform:scaleY(.6)}}

/* los botones responden al apretar, no al soltar */
.btn:active:not(:disabled){transform:scale(.97);transition:transform 100ms ease-out}

/* la comunidad: una franja negra antes del pie, en todas las páginas */
.g-comunidad{width:100vw;margin:clamp(64px,10vw,130px) 0 0 calc(50% - 50vw);padding:clamp(40px,6vw,72px) var(--borde);
  background:var(--ink);color:var(--paper);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px clamp(28px,5vw,72px);align-items:end}
.g-comunidad > *{max-width:640px}
.g-comunidad h2{font-size:clamp(2rem,4.6vw,3.8rem);text-transform:uppercase;letter-spacing:-.04em;color:var(--paper)}
.g-comunidad h2 em{text-transform:none;font-size:.92em}
.g-comunidad p{margin:14px 0 0;font-size:1.05rem;color:rgba(245,240,230,.78)}
.g-comunidad-form{display:grid;gap:10px}
.g-comunidad-form .lbl{color:rgba(245,240,230,.75)}
.g-comunidad-form > div{display:flex;border:1px solid var(--paper)}
.g-comunidad-form .input{flex:1;min-width:0;border:0;background:transparent;color:var(--paper);padding:14px 16px;font-size:16px}
.g-comunidad-form .input::placeholder{color:rgba(245,240,230,.45)}
.g-comunidad-form .input:focus{outline:2px solid var(--cherry);outline-offset:-2px}
.g-comunidad-form .btn{border:0;border-left:1px solid var(--paper)}
.g-comunidad-form small{color:rgba(245,240,230,.6);font-size:12.5px}
.g-comunidad-form small a{color:var(--paper);text-decoration:underline;text-underline-offset:3px}
.g-comunidad + .foot{margin-top:0;border-top:0}
body[data-view=subasta] .g-comunidad{border-top:1px solid rgba(245,240,230,.2)}

/* el pie: la marca y las redes a la izquierda, dos columnas con título a la derecha */
.foot{grid-template-columns:minmax(0,1.5fr) minmax(0,.75fr) minmax(0,.75fr);gap:28px clamp(28px,5vw,64px);padding-top:40px}
.foot-marca{gap:6px;align-content:start}
.foot-links{align-content:start;gap:10px}
.foot-tit{margin:0 0 6px;font:600 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.foot-nota{padding-top:18px;border-top:1px solid var(--line)}
.g-redes-fila{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-top:16px}
.g-redes-fila small{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.g-redes{list-style:none;display:flex;gap:8px;margin:0;padding:0}
.g-redes a,.g-redes span{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--ink);color:var(--ink);
  transition:background .2s var(--ease-out),color .2s var(--ease-out),border-color .2s var(--ease-out)}
.g-redes svg{width:20px;height:20px}
.g-redes a:hover{background:var(--cherry);border-color:var(--cherry);color:#fff}
.g-redes a:active{transform:scale(.94)}
.g-redes span{border-color:var(--line);color:var(--ink-3);cursor:default}
body[data-view=subasta] .g-redes a,body[data-view=subasta] .g-redes span{border-color:rgba(245,240,230,.4);color:var(--crema)}

@media (max-width:900px){
  .g-musica{grid-template-columns:1fr;gap:40px}
  .g-musica-txt{max-width:none}
  .g-musica-player{margin-right:10px}
  .g-comunidad{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr 1fr}
  .foot-marca{grid-column:1/-1}
}
@media (max-width:760px){
  .g-puertas{grid-template-columns:1fr}
  .g-puerta{border-right:0;border-bottom:1px solid var(--ink)}
  .g-puerta:last-child{border-bottom:0}
  .g-accs{grid-template-columns:1fr 1fr}
  .g-acc-art b{font-size:1.3rem}
  .g-subnav{width:100%}
  .g-subnav a{flex:1;text-align:center;padding:10px 8px;font-size:10.5px}
  .g-comunidad{padding-inline:16px}
  .g-comunidad-form > div{flex-direction:column}
  .g-comunidad-form .btn{border-left:0;border-top:1px solid var(--paper);justify-content:center}
  .g-musica-txt h2{font-size:clamp(2.4rem,12vw,3.4rem)}
}

/* ============================================================
   CONTRASTE (octubre 2026)
   El naranja del logo (#EF4724) da 3,3:1 sobre crema y el blanco encima
   3,75:1: alcanza para titulares grandes, no para texto pequeño ni botones.
   --cherry pasa a #C9381A (4,55:1 sobre crema, 5,17:1 con blanco encima);
   --marca guarda el naranja del logo para los bloques grandes, los
   titulares y lo que va sobre negro (ahí da 4,98:1).
   ============================================================ */
:root{--cherry:#C9381A;--cherry-2:#A82E14;--marca:#EF4724}
h1 em,h2 em{color:var(--marca)}
.g-hero-art{background:var(--marca)}
.g-hero-tag{color:var(--ink)}
.g-hero-tag b{color:var(--paper)}
.g-musica-player::after{background:var(--marca)}
.g-eq i{background:var(--marca)}
/* sobre negro va el naranja del logo, que ahí sí se lee */
.g-ticker em,.g-manifiesto .g-num,.g-principios li::before,.g-comunidad .g-num,.plan.hot .plan-lista li::before{color:var(--marca)}
.g-ticker span::after{background:var(--marca)}
.g-comunidad h2 em,.g-manifiesto h2 em{color:var(--marca)}
.g-comunidad .btn.primary,.g-comunidad-form .btn{background:var(--cherry)}
/* la casilla de la comunidad */
.g-consiente{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;line-height:1.45;color:rgba(245,240,230,.88)}
.g-consiente input{flex:0 0 auto;width:20px;height:20px;margin:1px 0 0;accent-color:var(--marca)}

/* ============================================================
   EL POP-UP DEL BONO DE BIENVENIDA
   Aparece en el centro, con un velo detrás: en una esquina la gente lo
   pasaba de largo y lo que más importa es recoger el correo. Se cierra
   con la ✕, tocando el velo o con Escape.
   Quién lo ve y cuándo se decide en popSobra() (js/main.js).
   ============================================================ */
/* En el centro de la pantalla, con un velo detrás: en una esquina se pasaba por alto. */
.g-pop-velo{position:fixed;inset:0;z-index:79;background:rgba(20,18,16,.55);opacity:0;transition:opacity .3s var(--ease-out);cursor:pointer}
.g-pop-velo.in{opacity:1}
.g-pop{position:fixed;z-index:80;left:50%;top:50%;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;
  display:flex;gap:20px;padding:28px 26px 24px;border:1px solid var(--line);border-radius:18px;background:var(--card);
  box-shadow:0 30px 70px -20px rgba(29,20,15,.6);
  opacity:0;transform:translate(-50%,calc(-50% - var(--g-pop-piso,0px)/2 + 14px)) scale(.97);
  transition:opacity .3s var(--ease-out),transform .34s var(--ease-out)}
/* --g-pop-piso es lo que ocupe abajo la bandeja del carrito o el aviso de
   cookies (lo mide popPiso en main.js): el pop-up sube la mitad de eso y así
   los dos caben sin pisarse. Sin nada abajo vale 0 y queda centrado. */
.g-pop.in{opacity:1;transform:translate(-50%,calc(-50% - var(--g-pop-piso,0px)/2))}
/* mientras el carrito o un modal estén abiertos, el pop-up se quita de en medio */
body:has(dialog[open]) :is(.g-pop,.g-pop-velo){opacity:0;pointer-events:none}
.g-pop-x{position:absolute;top:7px;right:7px;width:30px;height:30px;display:grid;place-items:center;border:0;
  border-radius:50%;background:none;color:var(--ink-3);font-size:13px;line-height:1;cursor:pointer;
  transition:background .2s var(--ease-out),color .2s var(--ease-out)}
.g-pop-x:hover{background:var(--paper-2);color:var(--ink)}
/* el número es la marca de hallazgo: va en terracota, sin fondo de color */
.g-pop-pct{flex:0 0 auto;width:96px;margin:0;padding-top:2px;text-align:center}
.g-pop-pct b{display:block;font:italic 48px/1 var(--serif);color:var(--cherry)}
.g-pop-pct span{display:block;margin-top:5px;font:600 10px/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.g-pop-dice{min-width:0;flex:1}
.g-pop-dice h2{margin:0 0 6px;padding-right:22px;font:italic 28px/1.1 var(--serif);color:var(--ink)}
.g-pop-dice>p{margin:0 0 13px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.g-pop-dice .lbl{display:block;margin-bottom:5px}
/* el correo y el botón van uno encima del otro: en una tarjeta de 412 px
   el campo quedaba en 103 px y no cabía ni "tu@correo.com" */
.g-pop-fila{display:flex;flex-direction:column;gap:8px}
.g-pop-fila .btn{justify-content:center;white-space:nowrap}
.g-pop-ok{display:flex;align-items:flex-start;gap:9px;margin-top:11px;cursor:pointer;font-size:12px;line-height:1.4;color:var(--ink-2)}
.g-pop-ok input{flex:0 0 auto;width:17px;height:17px;margin:1px 0 0;accent-color:var(--cherry)}
.g-pop-dice small{display:block;margin-top:9px;font-size:11.5px;color:var(--ink-3)}
.g-pop-nuevo .g-pop-pct b{font-size:30px}
.g-pop-nuevo .g-pop-fila{margin-top:2px}

/* En el móvil el número va arriba y el formulario a todo el ancho */
@media (max-width:560px){
  .g-pop{flex-direction:column;gap:6px;padding:22px 18px 18px}
  .g-pop-pct{width:auto;display:flex;align-items:baseline;gap:10px;text-align:left}
  .g-pop-pct span br{display:none}
  .g-pop-pct b{font-size:34px}
  .g-pop-dice h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){.g-pop{transition:opacity .15s;transform:translate(-50%,-50%)}}

/* El final del pie, en una sola banda: antes el © y el letrero se leían como
   dos secciones distintas. */
.foot-fin{grid-column:1/-1;display:grid;gap:10px;justify-items:start;margin-top:22px}
.foot-fin .foot-nota{grid-column:auto}

/* Los planes, separados. Pegados en una sola tabla no se veía dónde acababa
   uno y empezaba el otro: Semilla y Barista se leían como un mismo bloque con
   Cosecha encima. Cada tarjeta lleva su borde y su aire. */
.planes{gap:16px;border:0}
.plan{border:1px solid var(--ink);margin-bottom:0}

/* El ahorro frente a comprar suelto: una línea, no otra píldora. La píldora
   ya la usa el ahorro por pagar adelantado y dos compitiendo se anulan. */
.plan-suelto{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.plan-suelto b{color:var(--cherry)}
.plan.hot .plan-suelto{color:rgba(245,240,230,.78)}
.plan.hot .plan-suelto b{color:var(--marca)}

/* "Próximamente" era el titular del marco vacío: letra grande en crema sobre
   el fondo rayado. Ahora que esas bolsas tienen foto, encima de un fondo claro
   no se leía y además empujaba la imagen fuera de la tarjeta. Con foto pasa a
   sello pequeño en la esquina, como el de las unidades disponibles. */
.cc-art.con-foto .g-pronto{position:absolute;top:12px;left:12px;z-index:2;width:auto;
  align-self:start;justify-self:start;padding:5px 10px;border-radius:4px;
  background:var(--ink);color:var(--paper);text-align:left;
  font:600 10px/1 var(--mono);letter-spacing:.1em}
.cc-art.con-foto .g-pronto i{display:none}

/* Las fotos traen su propio fondo, así que llenan el marco en vez de flotar
   dentro. Antes el marco pintaba su color y la foto quedaba encima como una
   calcomanía, con el recuadro a la vista. El degradado y la sombra del suelo
   también sobran: ya vienen en la foto. */
.cc-art.con-foto{padding:0}
.cc-art.con-foto::after{content:none}
.cc-art.con-foto .prod-foto{width:100%;height:100%;max-width:none;margin:0;object-fit:cover}
.g-prod-art .g-prod-foto{width:100%;height:100%;max-width:none;margin:0;object-fit:cover;display:block}
.g-prod-art{padding:0}
/* con foto detrás, el sello de "próximamente" se vuelve esquinero y legible */
.g-prod-art .g-pronto{position:absolute;top:14px;left:14px;z-index:2;width:auto;align-self:start;justify-self:start;
  padding:6px 11px;border-radius:4px;background:var(--ink);color:var(--paper);text-align:left;
  font:600 11px/1 var(--mono);letter-spacing:.1em}
.g-prod-art .g-pronto i{display:none}

/* Las fotos de las bolsas son verticales (800 × 1120) y todas traen la bolsa
   a la misma escala, que es lo que las hace verse parejas. El marco toma esa
   misma proporción para no recortar ninguna. */
.cc-art.con-foto{height:auto;aspect-ratio:800/1120}
.g-prod-art{aspect-ratio:800/1120}

/* La ficha de un café que viene: la foto de la bolsa con el sello de
   "próximamente" en la esquina, como en la tienda, en vez del letrero grande. */
.prod-escena.con-foto .g-pronto{position:absolute;top:14px;left:14px;z-index:2;width:auto;align-self:start;justify-self:start;
  padding:6px 11px;border-radius:4px;background:var(--ink);color:var(--paper);text-align:left;
  font:600 11px/1 var(--mono);letter-spacing:.1em}
.prod-escena.con-foto .g-pronto i{display:none}

/* ============================================================
   LAS FOTOS LLENAN SU MARCO, EN TODAS PARTES
   Cada foto trae su propio fondo y su propia sombra. Los marcos pintaban
   además su color detrás y dejaban aire alrededor, así que la foto se veía
   como una calcomanía pegada sobre un panel de otro color. Aquí se quita el
   aire, el color y la sombra dibujada, y la imagen ocupa el marco entero.
   ============================================================ */
/* El color del marco se queda como respaldo: la foto lo tapa por completo,
   pero si tarda en cargar es mejor ver la tinta de la marca que un hueco. */
.g-hero-art,.prod-escena,.g-puerta-art{padding:0}
.prod-escena::after,.g-hero-art::after{content:none}
.g-hero-art .g-hero-foto,
.prod-escena .prod-foto,
.g-puerta-art .g-prod-foto{width:100%;height:100%;max-width:none;min-height:0;margin:0;object-fit:cover;display:block}
/* el marco toma la proporción de la foto donde puede, y recorta lo mínimo donde no */
.prod-escena{min-height:0;aspect-ratio:800/1120}
.g-hero-art{min-height:0;aspect-ratio:800/1120}
.g-puerta-art{aspect-ratio:4/3}
/* el sello de la cosecha y el "próximamente" quedan por encima de la foto */
.g-hero-art .g-sello,.g-hero-art .g-hero-tag{z-index:2}
.prod-escena .g-pronto,.g-puerta-art .g-pronto{position:absolute;inset:auto auto 16px 16px;z-index:2;width:auto;
  align-self:end;justify-self:start;padding:6px 11px;border-radius:4px;background:var(--ink);color:var(--paper);
  text-align:left;font:600 11px/1 var(--mono);letter-spacing:.1em}
.prod-escena .g-pronto i,.g-puerta-art .g-pronto i{display:none}

/* ============================================================
   LA FRANJA DEL LANZAMIENTO
   Va arriba de todo, por encima de la cabecera pegajosa. Es una línea, no
   un banner: el sitio ya tiene suficiente color y esto acompaña, no grita.
   ============================================================ */
.g-franja{background:var(--ink);color:var(--paper)}
.g-franja a{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:6px 14px;
  max-width:1240px;margin:0 auto;padding:9px 20px;text-decoration:none;color:inherit;
  font:600 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.g-franja b{color:var(--marca)}
.g-franja i{font-style:normal;opacity:.75}
.g-franja em{font-style:normal;border-bottom:1px solid currentColor;padding-bottom:1px}
.g-franja a:hover em{color:var(--marca);border-color:var(--marca)}
/* separadores entre las piezas, sin escribirlos en el HTML */
.g-franja span::before,.g-franja i::before,.g-franja em::before{content:"·";margin-right:14px;opacity:.45}
@media (max-width:620px){
  .g-franja a{gap:4px 10px;padding:8px 14px;font-size:10.5px;letter-spacing:.08em}
  /* en pantalla angosta sobra la invitación: el resto de la página la repite */
  .g-franja em{display:none}
  .g-franja span::before,.g-franja i::before{margin-right:10px}
}

/* ============================================================
   LAS TRES TARJETAS DEL INICIO, RENGLÓN CON RENGLÓN
   Cada tarjeta acomodaba su texto por su cuenta: un nombre en dos líneas o
   una finca larga corría el resto hacia abajo, y el precio y el botón
   quedaban a tres alturas distintas. Con subgrid las tres comparten las
   filas (foto, finca, nombre, notas, precio), así que cada renglón arranca
   a la misma altura en las tres aunque una tenga más texto.
   ============================================================ */
@supports (grid-template-rows:subgrid){
  .g-prod{grid-row:span 5;grid-template-rows:subgrid;row-gap:0}
  .g-prod-body{grid-row:span 4;grid-template-rows:subgrid;align-content:stretch}
  .g-prod-body > *{align-self:start}
  .g-prod-body > .g-prod-foot{align-self:end}
}
/* Con el sello de preventa en la esquina, el puntaje SCA baja un renglón en
   vez de quedar debajo del sello. */
.g-prod-art:has(.g-pronto) .g-prod-sca{top:52px}

/* ============================================================
   EL AVISO DE COOKIES
   Abajo, discreto y con las dos opciones del mismo tamaño: un "aceptar"
   grande junto a un "no" escondido no es una autorización libre, y la
   Ley 1581 pide que lo sea.
   ============================================================ */
.cookies{position:fixed;z-index:90;left:16px;right:16px;bottom:16px;max-width:620px;margin:0 auto;
  display:grid;gap:12px;padding:18px 20px;background:var(--ink);color:var(--paper);
  border-radius:14px;box-shadow:0 26px 54px -20px rgba(29,20,15,.55)}
.cookies p{margin:0;font-size:13.5px;line-height:1.5;color:rgba(245,240,230,.9)}
.cookies a{color:var(--marca)}
.cookies-btn{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.cookies-btn .btn{flex:1 1 auto;justify-content:center;min-width:150px}
.cookies-btn .btn:not(.primary){border-color:rgba(245,240,230,.5);color:var(--paper)}
.cookies-btn .btn:not(.primary):hover{background:var(--paper);color:var(--ink)}
/* en el móvil va encima del dock, como el pop-up del bono */
@media (max-width:860px){
  .cookies{bottom:calc(86px + env(safe-area-inset-bottom,0px));left:10px;right:10px;padding:16px}
  .cookies-btn .btn{min-width:0;flex:1 1 130px}
}

/* ---- auditoría 4-11-2026 ----
   Las fotos tienen el fondo claro arriba: el crema de la marca sobre durazno,
   celeste o arena no se leía. Puntajes, número de serie y titular del hero van en tinta. */
.g-prod-sca,.g-prod-n,.cc-score,.cc-score b,.g-hero-tag,.g-hero-tag b{color:var(--ink)}
.cc-score small,.card-cafe.dark .cc-score small{color:var(--ink-2)!important}
.prod-sello,.prod-sello b,.prod-sello small{color:var(--ink)}

/* La preventa en la ficha: la fecha de salida y el cupo, aparte del párrafo del envío. */
.pre-aviso{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 12px;margin:14px 0 0;padding:12px 14px;border:1px solid var(--ink);background:var(--paper-2,#e9e2d4)}
.pre-aviso b{font:800 1rem var(--display);text-transform:uppercase;letter-spacing:.01em;color:var(--cherry)}
.pre-aviso span{justify-self:end;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.pre-aviso i{grid-column:1/-1;height:4px;background:linear-gradient(90deg,var(--ink) var(--q),rgba(20,18,16,.15) var(--q))}

/* En el celular la bolsa va primero: así se ve el producto antes que el precio. */
@media (max-width:900px){
  .prod-top > .prod-art{order:-1}
  .prod-top .prod-escena{aspect-ratio:1}
}

/* Las fincas dentro de la ficha de un café: una o dos tarjetas, sin estirarse
   a todo el ancho. */
.prod-fincas{margin-top:clamp(48px,7vw,88px)}
.prod-fincas .fincas{width:fit-content;max-width:100%}
.prod-fincas .fincas.n1{grid-template-columns:minmax(0,420px)}
.prod-fincas .fincas.n2{grid-template-columns:repeat(2,minmax(0,420px))}
@media (max-width:760px){.prod-fincas .fincas.n1,.prod-fincas .fincas.n2{grid-template-columns:1fr}}

/* La taza: una franja corta, la rueda a un lado y el puntaje con los datos al otro.
   Cada forma va en la tinta de su café (--c); crece desde el centro al entrar. */
.prod-taza{margin-top:clamp(40px,6vw,72px)}
.prod-taza .section-head h2{font-size:clamp(1.5rem,3vw,2.3rem)}
.tz{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);margin-top:18px;border:1px solid var(--ink)}
.tz-graf{padding:12px 10px;border-right:1px solid var(--ink);min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.tz-rueda{display:block;width:100%;height:auto;overflow:visible}
.tz-aro,.tz-eje{fill:none;stroke:var(--ink);stroke-opacity:.16;stroke-width:1;transition:stroke-opacity .2s var(--ease-out)}
.tz-forma{fill:var(--c);fill-opacity:.16;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.tz-punto{fill:var(--paper);stroke:var(--c);stroke-width:2}
.tz-capa{pointer-events:none;transition:transform .9s cubic-bezier(.2,1.3,.4,1);transition-delay:.1s}
.tz-at{cursor:pointer;outline:none;transition:opacity .4s var(--ease-out);transition-delay:calc(var(--i,0)*45ms + .25s)}
.tz-toque{fill:transparent}
.tz-k{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink);transition:fill .2s var(--ease-out)}
.tz-v{font:800 14px var(--display);fill:var(--cherry)}
.tz-at.on .tz-eje,.tz-at:focus-visible .tz-eje{stroke-opacity:.75}
.tz-at.on .tz-k,.tz-at:focus-visible .tz-k{fill:var(--cherry)}
html.js .tz:not(.in) .tz-capa{transform:scale(.04)}
html.js .tz:not(.in) .tz-at{opacity:0}
.tz-dato{display:flex;flex-direction:column;min-width:0}
.tz-total{display:flex;align-items:center;gap:12px;margin:0;padding:12px clamp(14px,2.2vw,22px);border-bottom:1px solid var(--ink)}
.tz-total b{font:800 clamp(3.2rem,6vw,4.4rem)/.9 var(--display);letter-spacing:-.05em;color:var(--pc)}
.tz-total small{font:600 10.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tz-lee{display:grid;align-content:center;gap:2px;min-height:68px;margin:0;padding:10px clamp(14px,2.2vw,22px);border-bottom:1px solid var(--ink);background:var(--paper-2)}
.tz-lee b{font:800 .95rem var(--display);text-transform:uppercase;letter-spacing:.01em}
.tz-lee span{font-size:.88rem;color:var(--ink-2)}
.tz-dato dl{margin:0;flex:1;display:flex;flex-direction:column}
.tz-dato dl div{flex:1;display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;padding:6px clamp(14px,2.2vw,22px);border-bottom:1px solid rgba(20,18,16,.16)}
.tz-dato dl div:last-child{border-bottom:0}
.tz-dato dt{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.tz-dato dd{margin:0;font-size:.92rem}
@media (max-width:760px){
  .tz{grid-template-columns:1fr}
  .tz-graf{border-right:0;border-bottom:1px solid var(--ink);padding:8px 4px}
  .tz-rueda{max-width:330px;margin-inline:auto}
}
@media (prefers-reduced-motion:reduce){
  .tz-capa,.tz-at{transition:none}
}

/* El merch que viene: la foto borrosa llena el marco y "Próximamente" va encima. */
.g-acc.con-foto .g-acc-art{padding:0;display:block}
.g-acc-foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform .6s var(--ease-out)}
.g-acc.con-foto .g-acc-art::after{content:"";position:absolute;inset:0;background:rgba(20,18,16,.26)}
.g-acc-pronto{position:absolute;z-index:1;inset:0;display:grid;place-items:center;padding:12px;text-align:center;color:var(--paper);font:800 clamp(1.5rem,2.7vw,2.3rem)/1 var(--display);letter-spacing:-.03em;text-transform:uppercase}
@media (hover:hover) and (pointer:fine){.g-acc.con-foto:hover .g-acc-foto{transform:scale(1.1)}}
.g-acc-body h3{margin:0;font-size:1.25rem;line-height:1.05;text-transform:uppercase}
@media (max-width:760px){.g-acc-pronto{font-size:1.05rem}}

/* La puerta del merch: la gorra borrosa con un velo para que se lea lo de encima.
   Sin el giro del hover: la foto llena el marco y se le verían las esquinas. */
.g-puerta.oscura .g-puerta-art::after{content:"";position:absolute;inset:0;z-index:1;background:rgba(20,18,16,.26)}
.g-puerta.oscura .g-acc-pronto{z-index:2;font-size:clamp(1.7rem,3.6vw,3rem)}
@media (hover:hover) and (pointer:fine){.g-puerta.oscura:hover .g-prod-foto{transform:scale(1.04)}}

/* Este café, en palabras: dos párrafos lado a lado para que no alarguen la página. */
.prod-dice{margin-top:clamp(40px,6vw,72px)}
.prod-dice .section-head h2{font-size:clamp(1.5rem,3vw,2.3rem)}
.dice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 40px;margin-top:18px;padding-top:18px;border-top:1px solid var(--ink)}
.dice p{margin:0;font-size:1.02rem;line-height:1.6;color:var(--ink-2)}
.dice p:first-child{font-size:1.12rem;color:var(--ink)}
@media (max-width:760px){.dice{grid-template-columns:1fr;gap:14px}}

</style>
</head>

function sueltoEquivalente(p) {

  if (view === "drop") return [casa, [t("nav_drops"), "drops"], ["Drop " + CONFIG.drop.n, "drop", CONFIG.drop.n]];
  const sueltas = { suscripcion: t("nav_suscripcion"), diario: t("nav_diario"), subasta: t("nav_subasta"),
                    drops: t("nav_drops"), gang: t("nav_gang"), ...legal };
  return sueltas[view] ? [casa, [sueltas[view], view]] : [];

const dropRestantes = () => Math.max(0, (D().bolsas || 0) - (D().vendidas || 0));
const dropAgotado = () => D().estado === "agotado" || (D().bolsas > 0 && dropRestantes() === 0);
const dropAbierto = () => D().estado === "abierto" && !dropAgotado();

function ruta(view, id, lang) {
  const L = lang || UI.lang, base = L === "en" ? "/en/" : "/";
  const enIdioma = (o) => (o && typeof o === "object" ? (o[L] ?? o.es) : o);
  const R = RUTAS[L] || RUTAS.es;
  if (view === "cafe" && id) { const p = prodById(id); return p ? base + R.cafe + "-" + slug(enIdioma(p.nombre)) : base + R.cafes; }
  /* El drop lleva su número en la dirección (/drop-001) y esa dirección no cambia nunca:
     es la que va en la bolsa, en la bio y en el canal de WhatsApp. */
  if (view === "drop") return base + R.drop + "-" + (id || CONFIG.drop.n);
  if (view === "entrada" && id) { const e = S.entradas.find((x) => x.id === id); return e ? base + R.entrada + "-" + slug(enIdioma(e.titulo)).slice(0, 60) : base + R.diario; }
  /* sin barra final: Vercel redirige /en/ a /en (trailingSlash: false) y la dirección oficial no debe redirigir */
  const out = base + (R[view] ?? "");
  return out.length > 1 && out.endsWith("/") ? out.slice(0, -1) : out;
}
/* ¿La dirección es de la versión en inglés? /en o /en/…, nunca /envios-y-devoluciones */
const esIngles = (path) => /^\/en(\/|$)/.test(String(path));
function vistaDeRuta(path) {
  const p = String(path).replace(/^\/(en(\/|$))?/, "").replace(/\.html$/, "").replace(/\/$/, "");
  if (!p || p === "index" || p.endsWith("nandez")) return { view: "inicio" };   // nandez.html: la tienda en un archivo
  /* /drop-001: si el número no es el del drop de ahora, lleva al listado en vez de dar 404.
     Una dirección de drop que alguien guardó o imprimió no se rompe. */
  if (p.startsWith("drop-")) { if (!visible("drops")) return { view: "noencontrada" };
    return p.slice(5) === CONFIG.drop.n ? { view: "drop" } : { view: "drops" }; }
  const pre = ["cafe-", "coffee-"].find((x) => p.startsWith(x));
  if (pre) { const s = p.slice(pre.length), pr = S.productos.find((x) => slug(x.nombre.es) === s || slug(x.nombre.en) === s); return pr ? { view: "cafe", id: pr.id } : { view: "cafes" }; }
  const preE = ["diario-", "journal-"].find((x) => p.startsWith(x));
  if (preE) { if (!visible("diario")) return { view: "noencontrada" };
    const s = p.slice(preE.length), e = S.entradas.find((x) => slug(x.titulo.es).slice(0, 60) === s || slug(x.titulo.en).slice(0, 60) === s); return e ? { view: "entrada", id: e.id } : { view: "diario" }; }
  for (const R of [RUTAS.es, RUTAS.en]) { const v = Object.keys(R).find((k) => R[k] === p && !["cafe", "entrada", "drop"].includes(k)); if (v) return visible(v) ? { view: v } : { view: "noencontrada" }; }
  return { view: "noencontrada" };
}

/* ---------- montaña: la altitud como firma visual ---------- */
function rng(seedStr) {
  let a = 0; for (const ch of String(seedStr)) a = (a * 31 + ch.charCodeAt(0)) >>> 0;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function ridge(o, { w = 320, h = 150, dark = false, label = true } = {}) {
  const r = rng(o.id || o.finca || "x"), alt = +(o.altitud?.v ?? o.altitud) || 1500, tt = Math.min(1, Math.max(0.08, (alt - 1000) / 1200));
  const col = PROC_COLOR[o.proceso?.v ?? o.proceso] || "#6a5646";
  const peakX = w * (0.5 + r() * 0.3), peakY = h * (0.92 - tt * 0.6);
  const layer = (amp, off, jit) => {
    let d = `M0 ${h}`;
    for (let i = 0; i <= 14; i++) {
      const x = (w * i) / 14, dist = Math.abs(x - peakX) / w;
      const y = Math.min(h, Math.max(peakY + off, peakY + off + dist * h * amp + (r() - 0.5) * jit));
      d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d + ` L${w} ${h} Z`;
  };
  /* una sola tinta, sin degradados (línea gráfica) */
  const lineCol = dark ? "rgba(230,215,195,.55)" : "rgba(74,46,27,.45)";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${layer(0.5, h * 0.12, 14)}" fill="${col}" opacity="${dark ? 0.35 : 0.22}"/>
    <path class="front" d="${layer(1.05, 0, 10)}" fill="${col}" opacity="${dark ? 0.9 : 0.8}"/>
    ${label ? `<line x1="0" x2="${w}" y1="${peakY}" y2="${peakY}" stroke="${lineCol}" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>` : ""}
  </svg>${label ? `<span class="alt-label" style="top:${((peakY / h) * 100).toFixed(1)}%">${msnm(alt)}</span>` : ""}`;
}

/* ---------- ventas: cliente y atribución al lote (lo usan la tienda y el panel) ---------- */
const bolsasLibres = (c) => Math.max(0, Math.round((c.bolsas || 0) - (c.bolsasVendidas || 0)));

function upsertCliente(nombre, ciudad, tel) {
  let cl = S.clientes.find((x) => x.nombre.toLowerCase() === nombre.toLowerCase());
  if (cl) { cl.tel = tel || cl.tel; cl.ciudad = ciudad || cl.ciudad; return cl; }
  cl = { id: nextId("CL"), nombre, tipo: "Cliente", ciudad, tel };
  S.clientes.unshift(cl);
  return cl;
}

/* Cada venta descuenta del lote que produjo ese café (admite fracciones: muestras de 100 g) */
function atribuirVenta(producto, unidades, valor) {
  const c = S.compras.find((x) => x.id === producto.loteId); if (!c || !unidades) return;
  c.bolsasVendidas = (c.bolsasVendidas || 0) + unidades;
  c.ingresos = (c.ingresos || 0) + (valor != null ? valor : unidades * producto.precio);
  if (bolsasLibres(c) < 1) c.estado = "VENDIDO";
}

/* ---------- contacto: WhatsApp si hay número, si no correo ---------- */
function contactoURL(texto, asunto) {
  if (CONFIG.whatsapp) return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`;
  return `mailto:${CONFIG.correo}?subject=${encodeURIComponent(asunto || CONFIG.marca)}&body=${encodeURIComponent(texto)}`;
}
const canalContacto = () => (CONFIG.whatsapp ? "WhatsApp" : (UI.lang === "en" ? "email" : "correo"));
/* Manda el registro al formulario externo si existe. Sin él, el registro solo sale si la persona
   envía el WhatsApp o el correo que le abrimos: por eso ese paso siempre queda a la vista. */
function enviarAviso(tipo, datos) {
  const cuerpo = { tipo, ...datos, pagina: location.href, idioma: UI.lang };
  /* texto plano: así el navegador no pide permiso previo (CORS) y Apps Script lo recibe */
  if (CONFIG.registro) return fetch(CONFIG.registro, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(cuerpo) })
    .then((r) => r.json()).then((j) => !!(j && j.ok)).catch(() => false);
  if (!CONFIG.formulario) return Promise.resolve(false);
  return fetch(CONFIG.formulario, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ tipo, ...datos, pagina: location.href }) }).then((r) => r.ok).catch(() => false);
}
const demo = () => { try { return /[?&]demo/.test(location.search); } catch { return false; } };

/* ---------- modal y avisos ---------- */
function modal(title, body, cls = "") {
  const d = $("#dlg"); d.className = cls;
  $("#dlg-title").innerHTML = title; $("#dlg-body").innerHTML = body;
  d.querySelector(".dlg-body").scrollTop = 0;
  if (!d.open) d.showModal();
}
const closeModal = () => $("#dlg").open && $("#dlg").close();

function toast(msg, { label, act, type } = {}) {
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.innerHTML = `<span class="t-ico"></span><span>${msg}</span>`;
  const kill = () => { el.classList.add("out"); setTimeout(() => el.remove(), 300); };
  if (label) { const b = document.createElement("button"); b.className = "tbtn"; b.textContent = label; b.onclick = () => { act(); kill(); }; el.append(b); }
  $("#toasts").append(el);
  setTimeout(kill, label ? 7000 : 4200);
}
function later(ms, fn) { setTimeout(() => { if (fn() !== false) { save(); softRefresh(); } }, ms); }

/* ============================================================
   PANEL · CORREOS
   Los contactos que deja la página (comunidad, listas de espera,
   suscripción, cotizaciones, pedidos) viven en una Hoja de Google
   de Nandez, a través del script de tools/correos/Codigo.gs.
   Aquí se ven, se filtran por etiqueta, se exportan a CSV y se les
   escribe una campaña que sale desde Gmail. Todo gratis.
   La clave del script se guarda solo en el navegador de quien la pegó.
   ============================================================ */
const CO_KEY = "nandez-correos-clave";
const CO = { datos: null, cargando: false, error: null, etiqueta: "", buscar: "", resultado: null, borrador: { asunto: "", mensaje: "" } };
const coClave = () => { try { return localStorage.getItem(CO_KEY) || ""; } catch { return ""; } };
const coFecha = (v) => (v ? fmtFecha(String(v).slice(0, 10)) : "—");

function coCargar() {
  if (!CONFIG.registro || !coClave()) return;
  CO.cargando = true; CO.error = null; render();
  fetch(CONFIG.registro + "?accion=lista&clave=" + encodeURIComponent(coClave()))
    .then((r) => r.json())
    .then((j) => {
      CO.cargando = false;
      if (!j.ok) { CO.error = j.error === "clave" ? "La clave no coincide. Pégala de nuevo." : "El script respondió con un error."; if (j.error === "clave") coOlvidar(false); }
      else CO.datos = j;
      render();
    })
    .catch(() => { CO.cargando = false; CO.error = "No se pudo conectar con la hoja. Revisa la dirección del script y que esté publicado para cualquier persona."; render(); });
}
function coOlvidar(pintar = true) { try { localStorage.removeItem(CO_KEY); } catch {} CO.datos = null; if (pintar) render(); }

function coVisibles() {
  const q = CO.buscar.trim().toLowerCase();
  return (CO.datos?.contactos || []).filter((c) => (!CO.etiqueta || c.etiquetas.includes(CO.etiqueta))
    && (!q || `${c.correo} ${c.nombre || ""} ${c.ciudad || ""}`.toLowerCase().includes(q)));
}
const coDestinatarios = () => (CO.datos?.contactos || []).filter((c) => c.acepta && !c.baja && (!CO.etiqueta || c.etiquetas.includes(CO.etiqueta)));

        <button class="btn primary" data-act="co-clave">Guardar y cargar</button></div>
      ${CO.error ? `<p class="err">${esc(CO.error)}</p>` : ""}</section>`;

      <h2>${CO.error ? "No se pudo cargar" : "Cargando contactos…"}</h2>

    <div class="mkt-grid">${kpi(todos.length, "Contactos")}${kpi(aceptan.length, "Aceptan correos")}${kpi(bajas.length, "Se dieron de baja")}${kpi(CO.datos.cuota, "Envíos que quedan hoy")}</div>

    <div class="co-etiquetas" role="group" aria-label="Filtrar por etiqueta">

        <td>${c.etiquetas.map((e) => `<span class="co-tag">${esc(e)}</span>`).join(" ")}</td>

        <td class="mono">${coFecha(c.alta)}</td><td class="mono">${coFecha(c.ultimo)}</td></tr>`).join("")
        : `<tr><td colspan="5" class="hint">Todavía no hay contactos${CO.etiqueta || CO.buscar ? " con ese filtro" : ""}.</td></tr>`}</tbody></table></div>

      <div class="field"><label class="lbl" for="co-mensaje">Mensaje</label>

        `<li><span class="mono">${coFecha(e.fecha)}</span> <b>${esc(e.asunto)}</b> · ${esc(e.para)} · ${fmtNum(e.enviados)} enviados${e.pendientes ? `, ${fmtNum(e.pendientes)} para mañana` : ""}</li>`).join("")}</ul>` : ""}
    </section>

function coCSV() {
  const filas = [["correo", "nombre", "etiquetas", "acepta_correos", "alta", "ciudad"]]
    .concat(coVisibles().map((c) => [c.correo, c.nombre || "", c.etiquetas.join("; "), c.acepta && !c.baja ? "si" : "no", String(c.alta || "").slice(0, 10), c.ciudad || ""]));
  const csv = filas.map((f) => f.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = `nandez-contactos-${isoToday()}${CO.etiqueta ? "-" + slug(CO.etiqueta) : ""}.csv`;
  document.body.append(a); a.click(); a.remove();
}

function coEnviar(prueba) {
  const asunto = ($("#co-asunto")?.value || "").trim(), mensaje = ($("#co-mensaje")?.value || "").trim();
  if (!asunto || !mensaje) return toast("Escribe el asunto y el mensaje.", { type: "err" });
  CO.borrador = { asunto, mensaje };
  if (prueba) return coMandar(true);
  const n = Math.min(coDestinatarios().length, CO.datos.cuota);
  modal("Enviar la campaña", `<p class="hint">Vas a enviar «<b>${esc(asunto)}</b>» a <b>${fmtNum(n)}</b> ${n === 1 ? "persona" : "personas"}. Un correo enviado no se puede recoger.</p>
    <div class="dlg-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="co-enviar-ok">Sí, enviar</button></div>`, "narrow");
}
function coMandar(prueba) {
  closeModal();
  CO.resultado = prueba ? "Enviando la prueba…" : "Enviando…"; render();
  fetch(CONFIG.registro, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ accion: "enviar", clave: coClave(), prueba: !!prueba, etiqueta: CO.etiqueta, ...CO.borrador }) })
    .then((r) => r.json())
    .then((j) => {
      CO.resultado = !j.ok ? (j.error === "clave" ? "La clave no coincide." : "No se pudo enviar: revisa el asunto y el mensaje.")
        : prueba ? "Listo: la prueba llegó a tu Gmail. Revísala antes de enviar."
        : `Enviados ${fmtNum(j.enviados)}.${j.pendientes ? ` Quedan ${fmtNum(j.pendientes)} para mañana: vuelve a enviar la misma campaña.` : ""}`;
      if (j.ok) CO.datos.cuota = j.cuota;
      render();
      if (j.ok && !prueba) coCargar();
    })
    .catch(() => { CO.resultado = "No se pudo conectar con el script."; render(); });
}

/* Las acciones de esta pestaña: el panel general deja pasar lo que no conoce */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act^='co-']"); if (!el || el.disabled) return;
  switch (el.dataset.act) {
    case "co-clave": {
      const v = ($("#co-clave")?.value || "").trim(); if (!v) return;
      try { localStorage.setItem(CO_KEY, v); } catch {}
      CO.error = null; return coCargar();
    }
    case "co-cargar": CO.error = null; return coCargar();
    case "co-olvidar": return coOlvidar();
    case "co-etiqueta": CO.etiqueta = el.dataset.id || ""; return render();
    case "co-csv": return coCSV();
    case "co-prueba": return coEnviar(true);
    case "co-enviar": return coEnviar(false);
    case "co-enviar-ok": return coMandar(false);
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "co-buscar") { CO.buscar = e.target.value; render(); }
  if (e.target.id === "co-asunto") CO.borrador.asunto = e.target.value;
  if (e.target.id === "co-mensaje") CO.borrador.mensaje = e.target.value;
});

/* ---- operacion.js ---- */
/* ============================================================
   PANEL · PEDIDOS, DESPACHOS Y SUSCRIPCIONES
   Lo que llega de la tienda vive en la misma Hoja de Google que los
   correos (tools/correos/Codigo.gs) y se lee con la misma clave.
   - Pedidos: nuevo → pagado → despachado (con guía, le llega al
     cliente por correo) → entregado.
   - Suscripciones: en espera (dejó el correo) → activa (pagó, con la
     fecha del primer envío). Cada envío registrado corre la fecha
     1 o 2 meses y le manda la guía al suscriptor.
   Cada mañana el script le escribe a Nandez lo que toca despachar.
   ============================================================ */
const OP = { datos: null, cargando: false, error: null, filtro: "pendientes" };
const OP_ESTADOS = {
  nuevo: { txt: "Por confirmar", sig: "pagado", accion: "Marcar pagado" },
  pagado: { txt: "Por despachar", sig: "despachado", accion: "Despachar" },
  despachado: { txt: "En camino", sig: "entregado", accion: "Entregado" },
  entregado: { txt: "Entregado" },
  cancelado: { txt: "Cancelado" },
};
const SUB_ESTADOS = { espera: "En espera", activa: "Activa", pausada: "Pausada", cancelada: "Cancelada" };
const opDia = (v) => (v ? String(v).slice(0, 10) : "");
const opDias = (v) => Math.round((new Date(opDia(v) + "T00:00:00") - new Date(isoToday() + "T00:00:00")) / 864e5);
const opPlan = (id) => { const p = PLANES.find((x) => x.id === id) || (CAFETERIA.id === id ? CAFETERIA : null); return p ? tx(p.nombre) : id; };

function opCargar() {
  if (!CONFIG.registro || !coClave()) return;
  OP.cargando = true; OP.error = null; render();
  fetch(CONFIG.registro + "?accion=operacion&clave=" + encodeURIComponent(coClave()))
    .then((r) => r.json())
    .then((j) => {
      OP.cargando = false;
      if (!j.ok) OP.error = j.error === "clave" ? "La clave no coincide. Cámbiala en la pestaña Correos." : "El script respondió con un error.";
      else OP.datos = j;
      render();
    })
    .catch(() => { OP.cargando = false; OP.error = "No se pudo conectar con la hoja. Si el script se actualizó, publica una versión nueva de la implementación."; render(); });
}
function opMandar(cuerpo, listo) {
  closeModal();
  return fetch(CONFIG.registro, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ clave: coClave(), ...cuerpo }) })
    .then((r) => r.json())
    .then((j) => { if (!j.ok) throw new Error(j.error); toast(listo(j)); opCargar(); })
    .catch(() => toast("No se guardó. Revisa la conexión y vuelve a intentar.", { type: "err" }));
}

  if (!CONFIG.registro || !coClave()) return `<section class="co-vacio">
      <p class="eyebrow">Pedidos</p><h2>Primero, conecta la hoja</h2>

  return `<section class="co op">
    <div class="section-head co-head"><p class="eyebrow">Pedidos y despachos</p>
      <h2>Lo que hay que <em>despachar</em></h2>
      <p class="hint">Cada pedido de la tienda llega aquí. Cuando lo despachas con la guía, al cliente le llega por correo. Cada mañana a las 7 te llega a ${esc(CONFIG.correo)} el resumen de lo que toca.</p>
      <div class="co-fila"><button class="btn sm" data-act="op-cargar">${OP.cargando ? "Actualizando…" : "Actualizar"}</button>
        <a class="btn sm" href="${esc(OP.datos.hoja)}" target="_blank" rel="noopener">Abrir la hoja</a></div></div>

    <div class="mkt-grid">${kpi(porConfirmar.length, "Por confirmar el pago", true)}${kpi(porDespachar.length, "Por despachar", true)}
      ${kpi(tocan.length, "Suscripciones en 7 días", true)}${kpi(bonos.usados, `Bonos usados de ${fmtNum(bonos.entregados)}`)}</div>

    <h3 class="op-tit">Pedidos</h3>
    <div class="co-etiquetas" role="group" aria-label="Filtrar pedidos">
      ${filtros.map(([k, txt, n]) => `<button class="chip" aria-pressed="${OP.filtro === k}" data-act="op-filtro" data-id="${k}">${txt} · ${n}</button>`).join("")}</div>
    <div class="table-scroll"><table class="b2b-tabla co-tabla op-tabla">
      <thead><tr><th>Pedido</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.length ? lista.map((p) => {
        /* Una reserva de la pasarela la marca pagada el aviso firmado de Wompi, no
           una persona: sin botón, para no despachar algo que nunca se cobró. */
        const e = p.canal === "wompi" && p.estado === "nuevo" ? { txt: "Pagando en línea" } : OP_ESTADOS[p.estado] || { txt: p.estado };

/* ---------- datos para la factura ----------
   La factura se hace a mano en el servicio gratuito de la DIAN; esto deja cada
   dato en el orden en que lo pide el formulario. El precio de la tienda ya trae
   el IVA adentro y la factura pide el valor unitario SIN impuesto y el IVA
   aparte, así que acá se separan. Si hubo bono, va restado en cada línea, igual
   que como se cobró. Es texto plano a propósito: se prueba fuera del navegador. */
function textoFactura(p) {
  const tasa = CONFIG.iva || 0, items = Array.isArray(p.items) ? p.items : [];
  const subtotal = Number(p.subtotal) || 0, desc = Number(p.descuento) || 0, envio = Number(p.envio) || 0;
  const factor = subtotal ? (subtotal - desc) / subtotal : 1, d2 = (n) => fmtNum(n, 2);
  const L = ["ADQUIRIENTE", `Nombre: ${p.nombre || ""}`, `Cédula o NIT: ${p.documento || "FALTA: pedírselo"}`,
    `Dirección: ${[p.direccion, p.detalle].filter(Boolean).join(", ") || "FALTA: pedírsela"}`,
    `Municipio: ${[p.ciudad, p.departamento].filter(Boolean).join(", ")}`];
  if (p.correo) L.push(`Correo: ${p.correo}`);
  if (p.tel) L.push(`Teléfono: ${p.tel}`);
  const lineas = items.filter((i) => i.p);
  if (!lineas.length) return { texto: L.concat(["", "Este pedido es de antes de que se guardara el precio por línea.",
    "Productos: " + String(p.productos || "").replace(/\n/g, "; ")]).join("\n"), cuadra: null };
  L.push("", `PRODUCTOS · valor unitario sin IVA · IVA ${tasa} %`);
  let base = 0, iva = 0;
  lineas.forEach((i) => {
    const n = Number(i.n) || 0, conIva = i.p * factor, sinIva = conIva / (1 + tasa / 100);
    base += sinIva * n; iva += (conIva - sinIva) * n;
    L.push(`${n} × ${i.nom || i.id} · ${d2(sinIva)} c/u`);
  });
  if (envio) L.push(`1 × Envío · ${d2(envio)} · sin IVA (transporte de carga: confirmar con el contador)`);
  const total = base + iva + envio, cuadra = Math.abs(total - (Number(p.total) || 0)) < 1;
  L.push("", "TOTALES", `Base gravable: ${d2(base)}`, `IVA ${tasa} %: ${d2(iva)}`);
  if (envio) L.push(`Envío: ${d2(envio)}`);
  L.push(`Total: ${d2(total)}`);
  if (desc) L.push(`(Ya incluye el bono ${p.bono || ""} de ${cop(desc)}.)`);
  return { texto: L.join("\n"), cuadra, base, iva, total };
}
function opFactura(id) {
  const p = OP.datos.pedidos.find((x) => x.id === id); if (!p) return;
  const f = textoFactura(p);
  modal(`Factura de <em>${esc(id)}</em>`, `
    <p class="hint">Cópialo y llénalo en el servicio gratuito de facturación de la DIAN.</p>
    <pre class="pre">${esc(f.texto)}</pre>
    ${f.cuadra === false ? `<p class="hint err">Ojo: la suma no cuadra con el total del pedido (${cop(p.total)}). Revísalo antes de facturar.</p>` : ""}
    <div class="dlg-actions"><button class="btn" data-act="close">Cerrar</button>
      <button class="btn primary" data-act="op-factura-copiar" data-id="${esc(id)}">Copiar</button></div>`, "narrow");
}

const opGuia = () => ({ transportadora: ($("#op-transp")?.value || "").trim(), guia: ($("#op-guia")?.value || "").trim() });
const opAviso = (j) => (j.avisado ? " Le llegó la guía por correo." : "");

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act^='op-']"); if (!el || el.disabled) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "op-cargar": OP.error = null; return opCargar();
    case "op-filtro": OP.filtro = id; return render();
    case "op-avanzar": return opAvanzar(id);
    case "op-factura": return opFactura(id);
    case "op-factura-copiar": {
      const p = OP.datos.pedidos.find((x) => x.id === id); if (!p) return;
      try { return navigator.clipboard.writeText(textoFactura(p).texto).then(() => toast("Copiado."), () => toast("No se pudo copiar: selecciónalo a mano.", { type: "err" })); }
      catch { return toast("No se pudo copiar: selecciónalo a mano.", { type: "err" }); }
    }
    case "op-cancelar":
      return modal("Cancelar el pedido", `<p class="hint">El pedido <b>${esc(id)}</b> queda cancelado. No se le avisa al cliente.</p>
        <div class="dlg-actions"><button class="btn" data-act="close">Volver</button><button class="btn primary" data-act="op-cancelar-ok" data-id="${esc(id)}">Sí, cancelar</button></div>`, "narrow");
    case "op-cancelar-ok": return opMandar({ accion: "pedido", id, estado: "cancelado" }, () => `${id} cancelado.`);
    case "op-despachar-ok": {
      const g = opGuia(); if (!g.guia) return toast("Escribe el número de guía.", { type: "err" });
      return opMandar({ accion: "pedido", id, estado: "despachado", ...g }, (j) => `${id} despachado.${opAviso(j)}`);
    }
    case "op-sub-envio": return opSubEnvio(id);
    case "op-sub-envio-ok": {
      const g = opGuia(); if (!g.guia) return toast("Escribe el número de guía.", { type: "err" });
      return opMandar({ accion: "sub-envio", fila: +id, ...g }, (j) => `Envío registrado. El próximo: ${coFecha(j.proximo)}.${opAviso(j)}`);
    }
    case "op-sub-activar": return opSubActivar(id);
    case "op-sub-activar-ok": {
      const f = $("#op-proximo")?.value; if (!f) return toast("Escoge la fecha.", { type: "err" });
      return opMandar({ accion: "suscripcion", fila: +id, estado: "activa", proximo: f }, (j) => `Suscripción activa. Primer envío: ${coFecha(f)}.${j.avisado ? " Le llegó la fecha por correo." : ""}`);
    }
    case "op-sub": return opMandar({ accion: "suscripcion", fila: +id, estado: el.dataset.estado }, () => "Suscripción pausada.");
  }
});

/* ============================================================
   PANEL · ACTIVIDAD
   Qué hace la gente en la página y a quién vale la pena recordarle.
   - El embudo: de quienes entraron, cuántos vieron un café, cuántos
     lo echaron al carrito, cuántos fueron a pagar y cuántos compraron.
   - Los carritos abandonados de quien ya dejó su correo, con el
     botón que le manda el recordatorio (una vez, y solo si aceptó
     recibir correos).
   - Los que llegaron a la pasarela y no pagaron, con WhatsApp.
   - Quién se registró y qué es lo más visto.
   Todo sale de la bitácora propia (prototipo/js/medir.js) que guarda
   la Hoja de Google: solo anota a quien aceptó las cookies, así que
   son cifras de esas personas, no de todas las visitas.
   El píxel de Meta es otra cosa: sus datos se quedan en Meta y sirven
   para los anuncios; aquí solo se dice si está puesto.
   ============================================================ */
const AC = { datos: null, cargando: false, error: null, dias: 30 };
const AC_EVENTOS = { visita: "Entró a la página", ver: "Vio", agregar: "Agregó al carrito", pagar: "Fue a pagar", compra: "Compró", registro: "Se registró" };
const AC_PASOS = [["visita", "Entraron"], ["ver", "Vieron un café"], ["agregar", "Agregaron al carrito"], ["pagar", "Fueron a pagar"], ["compra", "Compraron"]];
const AC_ERRORES = { "no-acepta": "Esa persona no aceptó recibir correos.", "sin-correo": "No dejó correo.", ya: "Ya se le había recordado.",
  cuota: "Gmail no tiene cupo hoy: inténtalo mañana.", no: "Ese carrito ya no está abandonado.", "no-es-reserva": "Ese pedido ya no es una reserva sin pagar." };

function acCargar() {
  if (!CONFIG.registro || !coClave()) return;
  AC.cargando = true; AC.error = null; render();
  fetch(CONFIG.registro + "?accion=actividad&dias=" + AC.dias + "&clave=" + encodeURIComponent(coClave()))
    .then((r) => r.json())
    .then((j) => {
      AC.cargando = false;
      if (!j.ok) AC.error = j.error === "clave" ? "La clave no coincide. Cámbiala en la pestaña Correos." : "El script respondió con un error.";
      /* el script de antes responde ok sin saber qué es "actividad" */
      else if (!j.actividad) AC.error = "viejo";
      else AC.datos = j;
      render();
    })
    .catch(() => { AC.cargando = false; AC.error = "No se pudo conectar con la hoja. Si el script se actualizó, publica una versión nueva de la implementación."; render(); });
}
function acRecordar(cuerpo, quien) {
  closeModal();
  fetch(CONFIG.registro, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ accion: "recordar", clave: coClave(), ...cuerpo }) })
    .then((r) => r.json())
    .then((j) => {
      if (!j.ok) return toast(AC_ERRORES[j.error] || "No se envió. Vuelve a intentar.", { type: "err" });
      toast(`Recordatorio enviado a ${quien}.`); acCargar();
    })
    .catch(() => toast("No se envió. Revisa la conexión y vuelve a intentar.", { type: "err" }));
}

/* "hace 3 h", "hace 2 días": lo que importa de un carrito es cuánto lleva quieto */
function acHace(v) {
  const min = Math.max(0, Math.round((Date.now() - new Date(v).getTime()) / 60000));
  if (min < 60) return `hace ${min} min`;
  if (min < 48 * 60) return `hace ${Math.round(min / 60)} h`;
  return `hace ${Math.round(min / 1440)} días`;
}
const acWa = (tel) => "https://wa.me/57" + String(tel).replace(/\D/g, "").replace(/^57(?=\d{10}$)/, "");
const acPct = (n, de) => (de ? fmtNum((n / de) * 100) + " %" : "—");

/* El embudo: una barra por paso, todas del mismo color porque es una sola
   medida (personas). El número va escrito al lado, no hay que adivinarlo. */
function acEmbudo(e) {
  const tope = Math.max(1, ...AC_PASOS.map(([k]) => e[k] || 0));
  return `<div class="ac-embudo" role="table" aria-label="Embudo de la tienda">
    ${AC_PASOS.map(([k, txt], i) => {
      const n = e[k] || 0, antes = i ? e[AC_PASOS[i - 1][0]] || 0 : 0;
      return `<div class="ac-paso" role="row" title="${txt}: ${fmtNum(n)} personas${i ? ` · ${acPct(n, antes)} del paso anterior` : ""}">
        <span class="ac-paso-t" role="cell">${txt}</span>
        <span class="ac-barra" role="presentation"><i style="width:${n ? Math.max(1.5, (n / tope) * 100) : 0}%"></i></span>
        <b class="mono" role="cell">${fmtNum(n)}</b>
        <small role="cell">${i ? acPct(n, antes) + " del paso anterior" : "personas distintas"}</small></div>`;
    }).join("")}</div>`;
}
/* Las visitas de los últimos 14 días, una columna por día */
function acDias(serie) {
  const tope = Math.max(1, ...serie.map((d) => d.visita));
  return `<div class="ac-dias" role="img" aria-label="Personas que entraron cada día, últimos ${serie.length} días">
    ${serie.map((d) => `<span class="ac-dia" title="${fmtFecha(d.dia)}: ${fmtNum(d.visita)} entraron · ${fmtNum(d.agregar)} agregaron al carrito · ${fmtNum(d.compra)} compraron">
      <i style="height:${d.visita ? Math.max(4, (d.visita / tope) * 100) : 0}%"></i><small>${d.dia.slice(8)}</small></span>`).join("")}</div>`;
}

function viewActividad() {
  if (!CONFIG.registro || !coClave()) return `<section class="co-vacio">
      <p class="eyebrow">Actividad</p><h2>Primero, conecta la hoja</h2>
      <p class="hint">La actividad de la página se guarda en la misma Hoja de Google que los correos. Conéctala en la pestaña <b>Correos</b> y vuelve aquí.</p>
      <div class="co-fila"><button class="btn primary" data-act="atab" data-tab="correos">Ir a Correos</button></div></section>`;
  if (!AC.datos && !AC.cargando && !AC.error) setTimeout(acCargar, 0);
  if (AC.error === "viejo") return `<section class="co-vacio"><p class="eyebrow">Actividad</p>
      <h2>Falta actualizar el script de la hoja</h2>
      <p class="hint">La hoja todavía corre la versión anterior, que no sabe guardar la actividad. Es una sola vez:</p>
      <ol class="co-pasos">
        <li>Abre el proyecto <b>Nandez · correos</b> en <a href="https://script.google.com" target="_blank" rel="noopener">script.google.com</a>.</li>
        <li>Reemplaza todo el código por el de <code>tools/correos/Codigo.gs</code> y guarda.</li>
        <li>Ejecuta la función <b>configurar</b>: crea las hojas <b>Actividad</b> y <b>Carritos</b> sin tocar lo que hay.</li>
        <li><b>Implementar → Administrar implementaciones → editar → Nueva versión.</b> La dirección no cambia.</li>
      </ol>
      <p class="hint">Mientras tanto la página no anota nada ni muestra el aviso de cookies.</p>
      <div class="co-fila"><button class="btn primary" data-act="ac-cargar">Ya lo actualicé</button></div></section>`;
  if (!AC.datos) return `<section class="co-vacio"><p class="eyebrow">Actividad</p>
      <h2>${AC.error ? "No se pudo cargar" : "Cargando la actividad…"}</h2>
      ${AC.error ? `<p class="err">${esc(AC.error)}</p><div class="co-fila"><button class="btn" data-act="ac-cargar">Intentar otra vez</button></div>` : ""}</section>`;

  const d = AC.datos, e = d.embudo, porRecordar = d.carritos.filter((c) => c.acepta && !c.recordado);
  const plataQuieta = d.carritos.reduce((s, c) => s + c.total, 0) + d.anonimos.total;

document.addEventListener("click", (ev) => {

    case "ac-limpiar":
      return modal("Borrar lo medido hasta ahora", `
        <p class="hint">Se borra la bitácora de la página y los carritos que están sin cerrar: el embudo, lo más visto, los últimos movimientos y la lista de carritos abandonados quedan en cero.</p>

        <p class="hint err">Desde aquí no tiene vuelta atrás. Si te arrepientes, la Hoja de Google guarda el historial de versiones (<i>Archivo → Historial de versiones</i>).</p>
        <div class="dlg-actions"><button class="btn" data-act="close">Cancelar</button>
          <button class="btn primary" data-act="ac-limpiar-ok">Sí, borrar</button></div>`, "narrow");
    case "ac-limpiar-ok":

      return fetch(CONFIG.registro, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },

        .then((j) => { if (!j.ok) throw new Error(j.error); toast(j.borradas ? `Listo: ${fmtNum(j.borradas)} ${j.borradas === 1 ? "fila borrada" : "filas borradas"}.` : "No había nada que borrar."); acCargar(); })

    case "ac-dias": AC.dias = +id; return acCargar();
    case "ac-recordar": {
      const c = AC.datos.carritos.find((x) => x.v === id); if (!c) return;
      return modal("Recordar el carrito", `

        <p class="hint">Quedan ${fmtNum(AC.datos.cuota)} correos de Gmail por hoy.</p>
        <div class="dlg-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="ac-recordar-ok" data-id="${esc(id)}">Enviar</button></div>`, "narrow");
    }
    case "ac-recordar-ok": { const c = AC.datos.carritos.find((x) => x.v === id); return acRecordar({ carrito: id }, c ? c.correo : "el cliente"); }

      const p = AC.datos.sinPagar.find((x) => x.id === id); if (!p) return;
      return modal("Avisar del pedido sin pagar", `

        <div class="dlg-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="ac-recordar-pedido-ok" data-id="${esc(id)}">Enviar</button></div>`, "narrow");
