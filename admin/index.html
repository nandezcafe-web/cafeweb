  .ficha-tabla tbody th,.ficha-tabla td{padding:0;border:0;width:auto}
  .ficha-tabla tbody th{grid-column:1}
  .ficha-tabla .fn{grid-column:2;grid-row:1;justify-self:end}
  .ficha-tabla .fv,.ficha-tabla .ff{grid-column:1/-1}
  .leyenda{grid-template-columns:1fr 1fr}
}

/* panel: precio del día y su movimiento */
.mkt-aviso{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:12px;background:var(--card);padding:12px 16px;margin:-8px 0 24px}
.mkt-aviso.sube{border-left-color:var(--leaf)}
.mkt-aviso.baja{border-left-color:var(--cherry)}
.mkt-aviso b.mono{font-size:1.2rem;margin-left:6px}
.mkt-aviso .hint{margin:0}
.mkt-aviso .btn{margin-left:auto}
.mkt-delta{font:600 13px var(--mono)}
.mkt-aviso.sube .mkt-delta{color:var(--leaf)}
.mkt-aviso.baja .mkt-delta{color:var(--cherry)}
.mkt.act{gap:8px}
.mkt-linea{display:block;width:100%;height:60px;margin:22px 0 6px;color:var(--leaf)}
.pos{color:var(--leaf)}

/* ficha: lo que le pagamos a la finca */
.pago-finca{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:26px}
.pago-finca>div{background:var(--card);padding:16px 18px;display:grid;gap:4px;align-content:start}
.pago-finca b{font-size:1.4rem}
.pago-finca small{color:var(--ink-2);font-size:12.5px}
.pago-finca .pf-mas{text-align:center;min-width:130px}
.pago-finca .pf-mas b{font:400 2.1rem/1 var(--serif);color:var(--leaf)}
@media (max-width:640px){.pago-finca{grid-template-columns:1fr 1fr}.pago-finca .pf-mas{grid-column:1/-1}}
.no-encontrada .cta{margin-top:28px}
.prod-receta,.prod-ficha{margin-top:64px}


/* ---- la cereza por dentro ---- */
/* el radio se registra para que abra y cierre con suavidad; la posición no
   se interpola, tiene que pegarse al puntero sin arrastre */
@property --r { syntax: "<percentage>"; inherits: true; initial-value: 0%; }

/* el disco sobresale un 9 % de la fruta: el aire alrededor lo descuenta */
.cereza{margin:0;display:grid;gap:56px;justify-items:center;padding-block:9% 0}
.cereza-lente{--x:50%;--y:50%;--r:0%;position:relative;width:min(380px,82%);aspect-ratio:1;
  transition:--r .45s var(--ease-out);touch-action:none;cursor:crosshair}

/* la luz cálida detrás: dos manchas de la propia marca, muy bajas */
.cereza-halo{position:absolute;inset:-22%;border-radius:50%;pointer-events:none;
  background:radial-gradient(42% 42% at 32% 28%,rgba(168,50,31,.26),transparent 70%),
             radial-gradient(46% 46% at 72% 70%,rgba(92,122,74,.2),transparent 72%);
  filter:blur(28px)}


.cereza-lente img{position:absolute;inset:7%;width:86%;height:86%;object-fit:contain}
/* la ventana por donde se ve el corte */
.cereza-corte{
  -webkit-mask-image:radial-gradient(circle at var(--x) var(--y),#000 calc(var(--r) * .72),transparent var(--r));
  mask-image:radial-gradient(circle at var(--x) var(--y),#000 calc(var(--r) * .72),transparent var(--r))}


.cereza figcaption{display:grid;gap:10px;justify-items:center;text-align:center;max-width:42ch}
.cereza-pista{color:var(--ink-2);font-size:15px;margin:0}
.cereza-btn{font:inherit;font-size:15px;color:var(--ink);background:none;border:0;padding:2px 0;
  border-bottom:1px solid var(--line);cursor:pointer;transition:border-color .2s var(--ease-out)}
.cereza-btn:hover{border-bottom-color:var(--ink)}
.cereza-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}

/* las seis capas, de afuera hacia adentro: aquí la numeración sí es un orden */
.cereza-capas{list-style:none;counter-reset:capa;margin:6px 0 0;padding:0;
  display:grid;gap:12px;text-align:left;width:100%}
.cereza-capas li{counter-increment:capa;display:grid;grid-template-columns:auto 1fr;
  column-gap:12px;align-items:baseline;padding-top:10px;border-top:1px solid var(--line)}
.cereza-capas li::before{content:counter(capa);font:600 11px var(--mono);color:var(--ink-3)}
.cereza-capas b{font:400 1.05rem/1.2 var(--serif);grid-column:2}
.cereza-capas i{grid-column:2;font:italic 13px/1.3 var(--serif);color:var(--ink-3)}
.cereza-capas span{grid-column:2;color:var(--ink-2);font-size:13.5px;margin-top:2px}

.con-dedo{display:none}
@media (hover:none),(pointer:coarse){.con-mouse{display:none}.con-dedo{display:inline}}
@media (prefers-reduced-motion:reduce){.cereza-lente{transition-duration:.01ms}}

/* ============================================================
   VIDRIO.
   Una capa encima de todo lo anterior: el papel y sus colores siguen
   siendo los de la marca, lo que cambia es el material de lo que flota
   sobre él. Tres piezas hacen el efecto y ninguna sirve sola:
     1. algo de color detrás, porque el vidrio sin nada que refractar es gris;
     2. el desenfoque con saturación, que es lo que se ve a través;
     3. el canto de luz arriba y abajo, que es lo que lo vuelve un objeto.
   ============================================================ */
:root{
  --v-fondo:rgba(255,255,255,.30);
  --v-fondo-2:rgba(255,255,255,.50);
  --v-luz:rgba(255,255,255,.95);
  --v-luz-2:rgba(255,255,255,.32);
  --v-canto:rgba(255,255,255,.6);
  --v-sombra:0 1px 1px rgba(74,46,27,.04),0 24px 46px -28px rgba(74,46,27,.45);
  --v-brillo:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -1px 1px rgba(74,46,27,.05);
  --v-lente:blur(18px) saturate(1.5);
  --v-lente-2:blur(34px) saturate(1.7);
}
body[data-view=subasta]{
  --v-fondo:rgba(255,255,255,.05);
  --v-fondo-2:rgba(40,24,14,.55);
  --v-luz:rgba(255,255,255,.45);
  --v-luz-2:rgba(255,255,255,.14);
  --v-canto:rgba(255,255,255,.13);
  --v-sombra:0 24px 46px -28px rgba(0,0,0,.75);
  --v-brillo:inset 0 1px 1px rgba(255,255,255,.12);
}

/* 1. el color de atrás: tres manchas de la propia marca, que derivan despacio */
body::before{inset:-14%;
  background:
    radial-gradient(34vmax 34vmax at 16% 14%,rgba(192,90,62,.24),transparent 70%),
    radial-gradient(40vmax 40vmax at 86% 36%,rgba(46,71,50,.19),transparent 70%),
    radial-gradient(38vmax 38vmax at 36% 84%,rgba(214,160,84,.26),transparent 70%),
    repeating-radial-gradient(ellipse at 12% 18%,transparent 0 26px,rgba(29,20,15,.045) 26px 27px),
    repeating-radial-gradient(ellipse at 88% 72%,transparent 0 34px,rgba(29,20,15,.04) 34px 35px)}
body[data-view=subasta]::before{
  background:
    radial-gradient(34vmax 34vmax at 16% 14%,rgba(192,90,62,.30),transparent 70%),
    radial-gradient(40vmax 40vmax at 86% 40%,rgba(214,160,84,.14),transparent 70%),
    repeating-radial-gradient(ellipse at 15% 20%,transparent 0 26px,rgba(255,200,150,.03) 26px 27px),
    repeating-radial-gradient(ellipse at 85% 80%,transparent 0 34px,rgba(255,200,150,.025) 34px 35px)}
/* solo con mouse: en un celular, mover el fondo obliga a recalcular cada vidrio en cada cuadro */
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
  body::before{animation:deriva 46s ease-in-out infinite alternate}
}
@keyframes deriva{to{transform:translate3d(3%,-2.5%,0) rotate(2deg)}}

/* los resplandores se salen de su caja a propósito; lo que no pueden es ensanchar la página.
   clip y no hidden: hidden volvería el cuerpo un contenedor de scroll y soltaría el menú fijo */
html,body{overflow-x:clip}

/* 3. el canto de luz, compartido */
.top-inner::before,.btn::before,.cereza-vidrio::before,.tray::before{content:"";position:absolute;inset:0;
  border-radius:inherit;padding:1.4px;pointer-events:none;
  background:linear-gradient(180deg,var(--v-luz) 0%,var(--v-luz-2) 22%,transparent 42%,transparent 60%,var(--v-luz-2) 82%,var(--v-luz) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}

/* ---- el menú: una píldora que flota ---- */
.top,body[data-view=subasta] .top{position:sticky;top:0;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;
  background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
.top-inner{pointer-events:auto;position:relative;max-width:1180px;flex-wrap:nowrap;gap:10px 14px;
  padding:7px 9px 7px 20px;border-radius:999px;
  background:var(--v-fondo-2);backdrop-filter:var(--v-lente-2);-webkit-backdrop-filter:var(--v-lente-2);
  box-shadow:var(--v-brillo),var(--v-sombra)}
.tabs,body[data-view=subasta] .tabs{background:transparent;margin-inline:auto;flex-wrap:nowrap;padding:0}
.tab{transition:background .2s var(--ease-out),color .2s var(--ease-out);white-space:nowrap}
@media (hover:hover) and (pointer:fine){.tab:not([aria-current=page]):hover{background:rgba(74,46,27,.08)}}
.brand b{font-size:27px}
.lang,body[data-view=subasta] .lang{background:rgba(74,46,27,.08)}
body[data-view=subasta] .lang{background:rgba(255,255,255,.08)}
.cart-btn{background:var(--v-fondo);border-color:var(--v-canto);box-shadow:var(--v-brillo)}
@media (max-width:1080px){.brand small{display:none}}
@media (max-width:900px){.tab{padding:8px 10px;font-size:13px}.nav-time{display:none}}
@media (max-width:760px){
  .top{padding-inline:10px}
  .top-inner{flex-wrap:wrap;border-radius:26px;padding:7px 8px 7px 16px}
  .menu-btn{border-radius:999px;background:var(--v-fondo);border-color:var(--v-canto)}
  body.menu-abierto .top-inner{padding-bottom:12px}
  body.menu-abierto .tabs{border-top-color:rgba(74,46,27,.12)}
  body.menu-abierto .tab{border-bottom-color:rgba(74,46,27,.1)}
}

/* ---- botones ---- */
.btn{position:relative;border:0;background:var(--v-fondo);color:var(--ink);
  backdrop-filter:var(--v-lente);-webkit-backdrop-filter:var(--v-lente);
  box-shadow:var(--v-brillo),0 10px 22px -16px rgba(74,46,27,.5);
  transition:transform .16s var(--ease-out),background .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.btn:hover{background:var(--v-fondo-2);color:var(--ink)}
.btn.primary{background:rgba(74,46,27,.88);color:var(--paper);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28),inset 0 -1px 1px rgba(0,0,0,.2),0 14px 26px -16px rgba(74,46,27,.75)}
.btn.primary::before{opacity:.5}
.btn.primary:hover{background:rgba(58,36,21,.94);color:var(--paper)}
body[data-view=subasta] .btn.primary{background:rgba(230,215,195,.92);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.btn:not(:disabled):hover{transform:scale(1.02)}}
.btn:not(:disabled):active{transform:scale(.97)}
.btn:disabled:hover{background:var(--v-fondo)}
.btn.primary:disabled:hover{background:rgba(74,46,27,.88)}

/* ---- superficies ---- */
.card-cafe,.finca,.plan,.entrada,.faq,.val,.var,.item,.lot,.mode,.step,.wpanel,.levels,.receta div{
  background:var(--v-fondo);border:1px solid var(--v-canto);
  backdrop-filter:var(--v-lente);-webkit-backdrop-filter:var(--v-lente);
  box-shadow:var(--v-brillo),var(--v-sombra)}
/* la ficha conserva su filo de color: ese color dice quién comprobó el dato */
.attr{background:var(--v-fondo);border-left-color:var(--v-canto);border-right-color:var(--v-canto);border-bottom-color:var(--v-canto);
  backdrop-filter:var(--v-lente);-webkit-backdrop-filter:var(--v-lente);box-shadow:var(--v-sombra)}
.card-cafe,.finca,.plan,.entrada,.lot,.mode,.wpanel{border-radius:26px}
.faq,.val,.item,.var{border-radius:20px}
.chip,.chip-radio span,.notas-chips li,.input,.search{background:var(--v-fondo-2);border-color:var(--v-canto)}
.card-cafe,.finca,.entrada,.plan{transition:transform .35s var(--ease-out),box-shadow .35s var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .card-cafe:hover,.finca:hover,.entrada:hover{transform:translateY(-5px);
    box-shadow:var(--v-brillo),0 1px 1px rgba(74,46,27,.04),0 38px 60px -30px rgba(74,46,27,.55)}
}

/* ---- lo que se abre encima: más opaco, porque ahí se lee y se decide ---- */
dialog{background:rgba(239,229,215,.84);backdrop-filter:var(--v-lente-2);-webkit-backdrop-filter:var(--v-lente-2);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 50px 100px -40px rgba(29,20,15,.6)}
.dlg-head,.cart-foot{background:rgba(239,229,215,.7);backdrop-filter:var(--v-lente);-webkit-backdrop-filter:var(--v-lente)}
.tray{background:rgba(74,46,27,.84);backdrop-filter:var(--v-lente-2);-webkit-backdrop-filter:var(--v-lente-2);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.22),0 24px 50px -22px rgba(29,20,15,.7);--v-luz:rgba(255,255,255,.4);--v-luz-2:rgba(255,255,255,.12)}
.tray .btn:not(.primary){background:rgba(255,255,255,.12);color:var(--paper)}

/* ---- entradas: el contenido está visible de base y la animación solo lo trae.
        Si algo falla, se lee igual; y al terminar no deja nada pegado encima. ---- */
.reveal{opacity:1;transform:none;animation:entra .8s var(--ease-out) backwards;animation-delay:calc(var(--i,0)*90ms + 120ms)}
.calm .reveal,.calm .pal{animation:none}
@keyframes entra{from{opacity:0;filter:blur(10px);transform:translateY(20px)}}
/* el titular llega palabra por palabra */
.pal{display:inline-block;animation:palabra .7s var(--ease-out) backwards;animation-delay:calc(var(--w,0)*100ms + 150ms)}
@keyframes palabra{
  0%{opacity:0;filter:blur(10px);transform:translateY(50px)}
  50%{opacity:.5;filter:blur(5px);transform:translateY(-5px)}
  100%{opacity:1;filter:none;transform:none}}

/* ---- el disco de la cereza ---- */
.cereza-vidrio{position:absolute;inset:-9%;border-radius:50%;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.1) 55%,rgba(255,255,255,.22));
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.85),inset 0 22px 40px -24px rgba(255,255,255,.7),
             inset 0 -18px 34px -22px rgba(74,46,27,.2),0 54px 90px -46px rgba(74,46,27,.6)}
/* el reflejo de arriba: sin él es un círculo; con él es una lente */
.cereza-vidrio::after{content:"";position:absolute;inset:3% 16% auto 16%;height:30%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);filter:blur(7px)}

/* ============================================================
   LA PORTADA: el producto donde nace.
   La foto hace todo el trabajo; el texto se apoya en una sombra que va de
   la izquierda hacia el centro, justo hasta donde empieza la bolsa.
   ============================================================ */
.portada{--luz:#F4EAD7;position:relative;isolation:isolate;overflow:hidden;
  display:grid;align-items:center;min-height:540px;max-height:calc(100svh - 104px);aspect-ratio:16/9;
  margin-top:6px;border-radius:30px;color:var(--luz);background:#18231b;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 60px 100px -60px rgba(29,20,15,.8)}
.portada-foto,.portada-foto img{position:absolute;inset:0;width:100%;height:100%}
.portada-foto{z-index:-2}
.portada-foto img{object-fit:cover;object-position:60% 55%;animation:acercar 2.6s var(--ease-out) both}
@keyframes acercar{from{transform:scale(1.08)}}
.portada::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,rgba(16,24,18,.9) 0%,rgba(16,24,18,.7) 28%,rgba(16,24,18,.2) 50%,transparent 62%),
             linear-gradient(0deg,rgba(16,24,18,.55),transparent 34%)}
.portada-texto{display:grid;gap:18px;justify-items:start;max-width:min(600px,52%);padding:clamp(28px,5vw,60px) 20px clamp(28px,5vw,60px) clamp(24px,4.6vw,60px)}
.portada-sobre{margin:0;font:500 12.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(244,234,215,.78)}
.portada h1{font-size:clamp(2.6rem,4.7vw,4.4rem);line-height:.96;color:var(--luz)}
.portada h1 em{white-space:nowrap}
.portada h1 em{color:#EDA887}
.portada-lede{margin:0;font-size:1.08rem;line-height:1.55;color:rgba(244,234,215,.86);max-width:42ch}
.portada-cta{display:flex;align-items:center;flex-wrap:wrap;gap:12px 24px;margin-top:4px}
.btn.claro{background:rgba(244,234,215,.94);color:var(--ink);box-shadow:inset 0 1px 1px #fff,0 16px 30px -18px rgba(0,0,0,.6)}
.btn.claro:hover{background:#fff;color:var(--ink)}
.btn .ico{width:18px;height:18px;flex:0 0 auto;transition:transform .2s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.btn:hover .ico{transform:translateX(3px)}}
.portada-link{color:var(--luz);font-size:15px;text-decoration:underline;text-underline-offset:5px;
  text-decoration-color:rgba(244,234,215,.45);transition:text-decoration-color .2s}
.portada-link:hover{text-decoration-color:var(--luz)}
.portada-sellos{list-style:none;display:flex;flex-wrap:wrap;gap:14px 30px;margin:14px 0 0;padding:20px 0 0;
  border-top:1px solid rgba(244,234,215,.2)}
.portada-sellos li{display:flex;align-items:center;gap:10px;font:600 11px/1.35 var(--sans);letter-spacing:.1em;
  text-transform:uppercase;color:rgba(244,234,215,.86)}
.portada-sellos svg{width:28px;height:28px;flex:0 0 auto;color:var(--luz)}

@media (max-width:760px){
  .portada{display:flex;flex-direction:column;aspect-ratio:auto;max-height:none;min-height:0;border-radius:26px}
  .portada::before{display:none}
  .portada-texto{order:1;max-width:none;padding:28px 22px 24px}
  .portada h1 em{white-space:normal}
  .portada-foto{order:2;position:relative;inset:auto;height:auto;aspect-ratio:4/5}
  /* la foto sube a encontrarse con el verde del texto, sin corte */
  .portada-foto::after{content:"";position:absolute;inset:0 0 auto;height:26%;
    background:linear-gradient(180deg,#18231b,transparent)}
  .portada-sellos{gap:14px 20px}
  .portada-sellos li{font-size:10.5px}
}

/* ---- la cereza en su sección: la fruta a un lado, sus capas al otro ---- */
.por-dentro{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,6vw,90px);align-items:center}
.por-dentro .section-head{margin-bottom:26px}
@media (min-width:1000px){.por-dentro .cereza-capas{grid-template-columns:1fr 1fr;column-gap:30px}}
@media (max-width:860px){.por-dentro{grid-template-columns:1fr}.por-dentro .cereza{order:2}}

/* ============================================================
   LA BOLSA DE CADA CAFÉ.
   Se para sobre una luz cálida y una sombra suelta, como en la portada.
   ============================================================ */
.cc-art.con-foto{height:300px;display:grid;place-items:end center;padding-top:26px;
  background:radial-gradient(70% 60% at 50% 72%,rgba(255,255,255,.5),transparent 70%),
             linear-gradient(180deg,rgba(221,203,178,.55),rgba(230,215,195,.2))}
.cc-art.con-foto::after{content:"";position:absolute;left:30%;right:30%;bottom:16px;height:18px;border-radius:50%;
  background:rgba(74,46,27,.28);filter:blur(10px);z-index:0}
.prod-foto{position:relative;z-index:1;display:block;height:88%;width:auto;max-width:100%;object-fit:contain;
  transition:transform .45s var(--ease-out)}
.cc-art.con-foto .prod-foto{height:260px;margin-bottom:6px}
@media (hover:hover) and (pointer:fine){.card-cafe:hover .cc-art.con-foto .prod-foto{transform:translateY(-6px) scale(1.02)}}
.cc-art.con-foto .cc-score,.cc-art.con-foto .state{z-index:2}

.prod-escena{position:relative;display:grid;place-items:end center;min-height:clamp(380px,46vw,560px);
  padding:40px 24px 30px;border-radius:26px;overflow:hidden;border:1px solid var(--v-canto);
  background:radial-gradient(60% 55% at 50% 70%,rgba(255,255,255,.6),transparent 72%),
             linear-gradient(180deg,rgba(221,203,178,.6),rgba(239,229,215,.4));
  box-shadow:var(--v-brillo),var(--v-sombra)}
.prod-escena::after{content:"";position:absolute;left:28%;right:28%;bottom:28px;height:24px;border-radius:50%;
  background:rgba(74,46,27,.3);filter:blur(12px)}
.prod-escena .prod-foto{height:min(470px,40vw);min-height:320px}
.prod-sello{position:absolute;left:22px;top:18px;margin:0;z-index:2;display:flex;align-items:baseline;gap:6px}
.prod-sello b{font:400 clamp(2.6rem,4vw,3.4rem)/1 var(--serif);color:var(--ink)}
.prod-sello small{font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink-2)}
.prod-escena + .notas-chips{margin-top:14px}

.cart-art img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}

/* ============================================================
   NAVEGACIÓN FLOTANTE.
   Computador: la píldora se aparta al bajar, vuelve al subir y se compacta
   al hacer scroll; una sola luz oscura marca la sección y se desliza.
   Celular: la navegación baja al pulgar, en una barra que flota abajo.
   ============================================================ */
.top{transition:transform .5s var(--ease-out)}
body.nav-oculta .top{transform:translateY(calc(-100% - 24px))}
.top-inner{transition:max-width .5s var(--ease-out),padding .35s var(--ease-out),box-shadow .35s var(--ease-out)}
body.nav-compacta .top-inner{max-width:1040px;padding-block:5px;
  box-shadow:var(--v-brillo),0 22px 44px -24px rgba(74,46,27,.6)}
body.nav-compacta .brand small{display:none}

/* la luz: sin JavaScript, cada pestaña activa lleva su propio fondo y se lee igual */
.tabs{position:relative}
.tab{position:relative;z-index:1}
.tabs.con-luz .tab[aria-current=page]{background:transparent;transition:color .3s var(--ease-out)}
.tab-luz{position:absolute;left:0;top:0;z-index:0;height:100%;width:var(--w,0);border-radius:999px;
  transform:translateX(var(--x,0));background:var(--ink);opacity:0;pointer-events:none;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 6px 14px -8px rgba(29,20,15,.6);
  transition:transform .5s var(--ease-out),width .5s var(--ease-out),opacity .2s}
.tab-luz.quieta{transition:none}
body[data-view=subasta] .tab-luz{background:var(--crema)}

.dock,.dock-hoja{display:none}

@media (max-width:760px){
  /* arriba queda solo la marca, y se va con la página */
  .top,body[data-view=subasta] .top{position:relative}
  body.nav-oculta .top{transform:none}
  .top-inner .tabs,.top-inner .lang,.top-inner .menu-btn,.top-inner .cart-btn{display:none!important}
  .top-inner{padding:9px 16px}

  .dock{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:fixed;z-index:70;
    left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:26px;
    background:var(--v-fondo-2);backdrop-filter:var(--v-lente-2);-webkit-backdrop-filter:var(--v-lente-2);
    box-shadow:var(--v-brillo),0 20px 44px -18px rgba(74,46,27,.6)}
  .dock::before,.dock-hoja::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;pointer-events:none;
    background:linear-gradient(180deg,var(--v-luz) 0%,var(--v-luz-2) 22%,transparent 42%,transparent 60%,var(--v-luz-2) 82%,var(--v-luz) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .dock-it{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;min-height:54px;padding:6px 2px 5px;
    border:0;border-radius:20px;background:none;color:var(--ink-2);font:600 11px/1 var(--sans);text-decoration:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:background .25s var(--ease-out),color .25s var(--ease-out),transform .12s var(--ease-out)}
  .dock-it svg{width:23px;height:23px}
  .dock-it:active{transform:scale(.93)}
  .dock-it[aria-current=page],.dock-it[aria-expanded=true]{background:var(--ink);color:var(--paper)}
  .dock-it:focus-visible{outline:2px solid var(--cherry);outline-offset:-2px}
  .dock-it .live-dot{position:absolute;top:8px;left:calc(50% + 7px);width:7px;height:7px}
  .dock-n{position:absolute;top:4px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--cherry);color:#fff;font:600 11px/18px var(--mono);text-align:center}
  body[data-view=subasta] .dock-it{color:#d3c0a5}
  body[data-view=subasta] .dock-it[aria-current=page],body[data-view=subasta] .dock-it[aria-expanded=true]{background:var(--crema);color:var(--roast)}

  /* "Más": una hoja que sale de la barra, justo encima */
  .dock-hoja:not([hidden]){display:grid;gap:2px;position:fixed;z-index:69;left:10px;right:10px;
    bottom:calc(88px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:24px;
    background:var(--v-fondo-2);backdrop-filter:var(--v-lente-2);-webkit-backdrop-filter:var(--v-lente-2);
    box-shadow:var(--v-brillo),0 24px 50px -20px rgba(74,46,27,.6);animation:hoja .32s var(--ease-out)}
  @keyframes hoja{from{opacity:0;transform:translateY(14px) scale(.98)}}
  .dock-hoja .tab{display:flex;min-height:50px;padding:0 16px;border-radius:16px;font-size:16px;align-items:center}
  .dock-hoja .tab[aria-current=page]{background:var(--ink);color:var(--paper)}
  .dock-hoja .lang{display:flex;margin:6px 4px 4px;padding:3px}
  .dock-hoja .lang button{flex:1;min-height:44px;font-size:13px}

  /* lo que flota abajo se corre para no quedar tapado por la barra */
  .tray{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.top,.top-inner,.tab-luz,.dock-it{transition:none}.dock-hoja:not([hidden]){animation:none}}
/* sobre la foto oscura de la portada el vidrio fino se vuelve gris: la barra y la hoja
   llevan más cuerpo, porque ahí se lee y se decide */
@media (max-width:760px){
  .dock{background:rgba(239,229,215,.8)}
  .dock-hoja:not([hidden]){background:rgba(239,229,215,.92)}
  body[data-view=subasta] .dock,body[data-view=subasta] .dock-hoja:not([hidden]){background:rgba(58,36,22,.88)}
}

/* ============================================================
   EL RESTO DEL INICIO, CON LA VOZ DE LA PORTADA.
   Más aire entre secciones, íconos de trazo fino en vez de cajas, montañas
   con la bruma verde de la foto, y un cierre que responde a la portada.
   ============================================================ */
@media (min-width:761px){.section{padding-block:104px 8px}}

/* principios: tres columnas separadas por una línea, sin cajas */
.principios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:40px;border-top:1px solid var(--line)}
.principio{display:grid;align-content:start;gap:12px;padding:32px 32px 8px 0}
.principio + .principio{padding-left:32px;border-left:1px solid var(--line)}
.principio svg{width:34px;height:34px;color:var(--cherry)}
.principio b{font:400 clamp(1.35rem,2vw,1.7rem)/1.15 var(--serif)}
.principio span{color:var(--ink-2);font-size:15px;line-height:1.6;max-width:36ch}
@media (max-width:760px){
  .principios{grid-template-columns:1fr}
  .principio{padding:26px 0 18px}
  .principio + .principio{padding-left:0;border-left:0;border-top:1px solid var(--line)}
}

/* fincas: la montaña deja el marrón plano y toma la bruma verde de la portada.
   La línea punteada y la cifra siguen diciendo a qué altura está cada una. */
.finca-art{height:132px;background:linear-gradient(180deg,#e8dcc6 0%,#d6c8aa 58%,#c3b590 100%)}
.finca-art::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 22% 12%,rgba(255,238,205,.65),transparent 70%),
             linear-gradient(180deg,transparent 55%,rgba(232,220,198,.28))}
.finca-art svg path{fill:#34503b}
.finca-art svg path:first-child{fill:#7a9170;opacity:.6}
.finca-art svg path.front{opacity:.94}
.finca.propia .finca-art{background:linear-gradient(180deg,#eadfcb,#d9ccb1)}
.finca.propia .finca-art svg path.front{opacity:.55}

/* preguntas: el título se queda a la izquierda y las respuestas corren a la derecha */
@media (min-width:900px){
  .faqs{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:0 72px;align-items:start}
  .faqs .section-head{position:sticky;top:120px}
  .faqs .faq-lista{margin-top:0;max-width:none}
}

/* el remate del inicio: la misma tarde de la portada, sin la bolsa */
.remate{--luz:#F4EAD7;position:relative;isolation:isolate;overflow:hidden;display:grid;align-items:center;
  min-height:440px;margin-top:120px;border-radius:30px;color:var(--luz);background:#18231b;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 60px 100px -60px rgba(29,20,15,.8)}
.remate-foto{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:72% 40%}
.remate::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,rgba(16,24,18,.9) 0%,rgba(16,24,18,.66) 38%,rgba(16,24,18,.12) 68%,transparent 82%)}
.remate-texto{display:grid;gap:16px;justify-items:start;max-width:620px;padding:clamp(30px,5vw,64px)}
.remate h2{font-size:clamp(2.3rem,4.4vw,3.8rem);line-height:.98;color:var(--luz)}
.remate h2 em{color:#EDA887}
.remate .portada-sobre{color:rgba(244,234,215,.78)}
.remate-texto > p:not(.portada-sobre){margin:0;font-size:1.06rem;color:rgba(244,234,215,.86)}
@media (max-width:760px){
  .remate{min-height:0;margin-top:80px;border-radius:26px}
  .remate-foto{object-position:88% 30%}
  .remate::before{background:linear-gradient(180deg,rgba(16,24,18,.55),rgba(16,24,18,.9))}
}

/* ============================================================
   PREGUNTAS: una lista editorial, no una pila de cajas.
   Una línea fina separa cada pregunta; el botón redondo pasa de + a −;
   la respuesta tiene un ancho que se lee sin perder la línea.
   ============================================================ */
.faq-lista{gap:0;border-bottom:1px solid var(--line)}
.faq-lista .faq{padding:0;border:0;border-top:1px solid var(--line);border-radius:0;background:none;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.faq-lista .faq summary{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 4px;cursor:pointer}
.faq-lista .faq h3{font-size:clamp(1.12rem,1.7vw,1.36rem);line-height:1.3;transition:color .2s var(--ease-out)}
.faq-lista .faq summary::after{content:"";flex:0 0 38px;height:38px;border-radius:50%;color:var(--ink);
  border:1px solid var(--v-canto);box-shadow:var(--v-brillo),0 6px 14px -10px rgba(74,46,27,.5);
  background:linear-gradient(currentColor,currentColor) center/13px 1.5px no-repeat,
             linear-gradient(currentColor,currentColor) center/1.5px 13px no-repeat,var(--v-fondo-2);
  transition:transform .4s var(--ease-out),background-size .3s var(--ease-out),background-color .25s var(--ease-out),color .25s}
.faq-lista .faq[open] summary::after{transform:rotate(180deg);color:var(--paper);background-color:var(--ink);
  background-size:13px 1.5px,1.5px 0,auto}
.faq-lista .faq[open] h3{color:var(--ink)}
.faq-lista .faq p{margin:0;padding:0 70px 28px 4px;max-width:64ch;color:var(--ink-2);font-size:15.5px;line-height:1.7}
.faq-lista .faq[open] p{animation:respuesta .45s var(--ease-out)}
@keyframes respuesta{from{opacity:0;transform:translateY(-6px)}}
@media (hover:hover) and (pointer:fine){
  .faq-lista .faq summary:hover h3{color:var(--cherry)}
  .faq-lista .faq:not([open]) summary:hover::after{background-color:rgba(255,255,255,.75)}
}
.faq-lista .faq summary:focus-visible{outline:2px solid var(--cherry);outline-offset:4px;border-radius:10px}
.faq-ayuda{margin:22px 0 0;color:var(--ink-2);font-size:15px}
.faq-ayuda a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.faq-ayuda a:hover{text-decoration-color:var(--ink)}
@media (max-width:760px){
  .faq-lista{margin-top:26px}
  .faq-lista .faq summary{padding:20px 0;gap:16px}
  .faq-lista .faq p{padding:0 0 22px}
  .faq-lista .faq summary::after{flex-basis:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){.faq-lista .faq summary::after{transition:none}.faq-lista .faq[open] p{animation:none}}

/* ============================================================
   SUSCRIPCIÓN: dos preguntas arriba (¿kit? ¿cómo pagas?) que cambian
   el precio de las tres tarjetas, y el ahorro dicho en pesos.
   ============================================================ */
.sub-opciones{display:flex;flex-wrap:wrap;gap:12px 16px;margin:6px 0 30px}
.sub-opciones .seg{background:var(--v-fondo);border:1px solid var(--v-canto);box-shadow:var(--v-brillo);
  backdrop-filter:var(--v-lente);-webkit-backdrop-filter:var(--v-lente)}
.sub-opciones .seg button{padding:10px 16px;font-size:14px;transition:background .25s var(--ease-out),color .25s var(--ease-out)}
.sub-opciones .seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:inset 0 1px 1px rgba(255,255,255,.18)}
.plan{gap:12px}
.plan-para{margin:-4px 0 4px;color:var(--ink-2);font-size:14.5px}
.plan-precio{flex-wrap:wrap;row-gap:2px}
.plan-precio b{font-size:2rem}
.plan-precio small{font-size:13px}
.plan-luego{margin:-6px 0 0;color:var(--ink-2);font-size:14px}
.plan-ahorro{margin:-6px 0 0;align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:13.5px;
  background:rgba(46,71,50,.12);color:var(--leaf)}
.plan-kit{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.4);border:1px solid var(--v-canto)}
.plan-kit b{font:400 1.15rem/1.2 var(--serif)}
.plan-kit ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;font-size:13.5px;color:var(--ink-2)}
.plan-kit li::before{content:"+ ";color:var(--cherry);font-weight:700}
.plan-cada{margin:4px 0 -6px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.plan-cafeteria{max-width:520px;margin-top:30px}
.sub-resumen{margin:0 0 6px;padding:12px 14px;border-radius:14px;background:var(--paper-2);line-height:1.6}

/* la ruta: seis pasos en orden, con su número */
.ruta{list-style:none;counter-reset:ruta;margin:34px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.ruta li{counter-increment:ruta;display:grid;gap:6px;align-content:start;padding:24px 24px 22px 0;border-bottom:1px solid var(--line)}
.ruta li:not(:nth-child(3n+1)){padding-left:24px;border-left:1px solid var(--line)}

  background:var(--v-fondo-2);border:1px solid var(--v-canto);box-shadow:var(--v-brillo)}

.clock{--p:100;position:relative;width:176px;aspect-ratio:1;margin:0 auto;border-radius:50%;background:conic-gradient(var(--ember) calc(var(--p)*1%),rgba(255,255,255,.07) 0);display:grid;place-items:center}

.au-price b.flash{animation:flash 1s}
@keyframes flash{0%{color:var(--ember);text-shadow:0 0 28px rgba(255,106,61,.8);transform:scale(1.06)}100%{color:#fff;text-shadow:none;transform:none}}
.au-total{font:12.5px var(--mono);color:#d3c0a5}
.au-status{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

.rpill.ok{color:#E6D7C3;border-color:#8fa98f;background:rgba(80,160,100,.1)}
.rpill.me{color:#4A2E1B;background:var(--crema);border-color:var(--crema)}

.bidbox .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

.qbtn:hover{border-color:var(--ember)}
.qbtn:active{transform:scale(.96)}

.bid-row{display:flex;gap:8px;margin-top:8px}

@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bidbtn{background:var(--ember);color:#4A2E1B;border:0;border-radius:12px;padding:0 20px;font:700 15px var(--sans);cursor:pointer;box-shadow:0 10px 30px -10px rgba(255,106,61,.8)}
.bidbtn:hover{filter:brightness(1.08)}
.au-note{font-size:12.5px;color:#c9b497;margin:10px 0 0}
.au-feed{display:flex;flex-direction:column}

.bid .who{font-weight:600;font-size:13.5px}

@keyframes flash{0%{color:var(--ember);transform:scale(1.04)}100%{color:#fff;transform:none}}
.bid.top{background:rgba(192,90,62,.16)}

/* ============================================================
   NANDEZ COFFEE GANG · línea gráfica editorial (octubre 2026)
   Una capa encima de styles.css y auction.css. Lo que cambia:
     · el color: naranja del logo (#EF4724), crema de papel y negro carbón;
     · la letra: Bricolage Grotesque en negrita para titulares, Instrument
       Serif en cursiva para el acento, Instrument Sans para leer y
       IBM Plex Mono para los datos;
     · el material: ya no hay vidrio ni esquinas redondas. Todo es papel,
       líneas de 1 px y bloques de color, como una revista.
   Las piezas nuevas del inicio llevan prefijo g- y viven solo aquí.
   ============================================================ */
:root{
  --paper:#F5F0E6;--paper-2:#EBE4D6;--card:#FAF7F0;
  --ink:#141210;--ink-2:#3B3631;--ink-3:#6B645C;--line:rgba(20,18,16,.22);
  --cherry:#EF4724;--cherry-2:#D63B1A;--leaf:#1F5A3C;--gold:#C98A1E;--doc:#2C4FA3;
  --roast:#141210;--roast-2:#1C1916;--roast-3:#262220;--ember:#EF4724;--crema:#F5F0E6;
  --display:"Bricolage Grotesque","Instrument Sans","Segoe UI",system-ui,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:0;
  --borde:clamp(16px,3vw,40px);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font:15.5px/1.55 var(--sans)}
/* el papel: sin manchas de color detrás, solo un grano muy leve */
body::before,body[data-view=subasta]::before{background:none;animation:none;inset:0}
body::after{opacity:.06}
body[data-view=subasta]::after{opacity:.1}

/* ---- la letra ---- */
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:.95;font-variation-settings:"opsz" 96,"wdth" 100}
h1 em,h2 em,h3 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.015em;color:var(--cherry)}
body[data-view=subasta] h1 em,body[data-view=subasta] h2 em,body[data-view=subasta] h3 em{color:var(--cherry)}

   EL INICIO. Portada, cinta de datos, los tres cafés, el manifiesto,

   separadas por una línea, como las páginas de una revista.

.g-io{opacity:1;transform:none}

/* la portada: el titular ocupa media página, la bolsa va sobre un bloque naranja */

  min-height:calc(100svh - 120px);padding:clamp(20px,4vh,44px) 0 clamp(28px,5vh,56px);border-bottom:1px solid var(--ink)}
